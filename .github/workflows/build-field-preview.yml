name: Build field preview from game sources
# 미리보기 주소(1hyun-you.github.io/field-preview/): 배포 제외([skip deploy]) 커밋을 게임 주소와 별도로 확인하는 용도
# loop-game deploy-field.yml이 field-preview/source-ref.json 갱신 → 이 작업이 빌드
on:
  push:
    branches: [main]
    paths: ['field-preview/source-ref.json', 'dev/make-preview.cjs', '.github/workflows/build-field-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-field-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the preview source revision
        id: source
        run: |
          node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync('field-preview/source-ref.json','utf8'));if(!/^[0-9a-f]{40}$/.test(r.commit))throw Error('Invalid source revision');fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+r.commit+'\nversion='+r.version+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: 1hyun-you/loop-game
          ref: ${{ steps.source.outputs.commit }}
          path: game-source
          persist-credentials: false
      - name: Build the preview page
        run: |
          node game-source/dev/build.cjs
          node game-source/dev/check-build.cjs
          node dev/make-preview.cjs game-source/index.html field-preview/index.html "${{ steps.source.outputs.version }}"
      - name: Save the built preview page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add field-preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build field preview from the selected game revision'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
