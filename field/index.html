<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 0.27c 게임 주소 이전: /loop-game/ → /field/ (크롬 잔존 설치 기록 회피) */if(location.hostname.endsWith('github.io')&&location.pathname.indexOf('/loop-game/')===0)location.replace('/field/'+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="회귀의 들판">
<title>회귀의 들판</title>
<meta name="theme-color" content="#16141e">
<style>
@font-face{font-family:Galmuri11;src:url(fonts/Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Galmuri11;src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
/* 단일 어두운 화면(게임 화면 전용), 세로형 전체 화면 캔버스 + 상단 겹침 UI */
:root{
  color-scheme:dark;
  --bg:#16141e; --panel:#221f2e; --panel2:#2c2840; --line:#3d3854; --fg:#f0ecf7; --muted:#a49fb8; --accent:#7f74d6; --danger:#d0505c;
  --f-body:Galmuri11,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#16141e}
html,body{height:100%;margin:0;background:var(--bg);position:fixed;inset:0;color:var(--fg);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--f-body)}
canvas#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;background:#16141e}
/* 0.25 능력 보기 */
.abil{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;touch-action:pan-y;text-align:left}
.abil h3{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:400;text-align:left}
.ab{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.ab .ic{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#14121c;font-weight:700;font-size:13px}
.ab b{font-size:14px}.ab .lv{color:var(--muted);font-size:12px;margin-left:4px}.ab p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:pre-line}
.ab.exw{border-color:#ffd24a}
.sel-head{position:relative;width:100%;max-width:420px}
.sel-tools{display:flex;gap:10px;justify-content:center;margin-top:10px}.sel-tools button{padding:9px 18px;font-size:14px;border:2px solid #ffe08a;color:#ffe08a;background:rgba(40,30,10,.55)}.sel-tools button.on{background:#ffe08a;color:#2a1e08}
#backhint{position:fixed;left:50%;bottom:calc(var(--sab) + 70px);transform:translateX(-50%);background:rgba(20,18,30,.92);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:14px;z-index:9;pointer-events:none}
#ui{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
#ui>.layer{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:rgba(12,10,18,.78)}
.layer h2{margin:0;font-size:24px;text-wrap:balance}
.layer .sub{color:var(--muted);font-size:15px;text-align:center}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:15px;font-variant-numeric:tabular-nums}
.stats span:nth-child(odd){color:var(--muted)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active{transform:translateY(1px)}
button.pri{background:#463c8c;border-color:var(--accent)}
/* 레벨업 카드 (세로 나열, 테두리 색으로 종류 구분) */
#ui>.layer.sel{justify-content:flex-start;background:rgba(14,12,22,.9);overflow-y:auto;touch-action:pan-y}
.sel-head{text-align:center;margin-top:9vh}
.sel-head h2{margin:0 0 4px}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);width:100%}
.card .ic{flex:0 0 44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#14121c}
.card .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .nm{font-size:17px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .ds{font-size:14px;color:var(--muted);line-height:1.45}
.card .tag{font-size:12px;font-weight:500;padding:1px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.card.k-melee{border-color:#e0655a}.card.k-ranged{border-color:#5fbf6a}.card.k-magic{border-color:#5f8fe8}.card.k-passive{border-color:#a8904a}.card.k-fill{border-color:#6a6480}
.card.banish{border-style:dashed}
.card.k-relic{border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a inset}.card.k-branch{border-width:3px}.card.k-job{border-width:3px}
.card .ds{white-space:pre-line}
.sel-branch .sel-head h2,.sel-chest .sel-head h2{color:#ffe08a}.sel-job .sel-head h2,.sel-job2 .sel-head h2{color:#d9a8ff}
.card:disabled{opacity:.4}
.sel-actions{display:flex;gap:8px;width:100%;max-width:420px}
.sel-actions button{flex:1;font-size:15px;padding:11px 8px}
.sel-actions button.on{background:#7a2e3a;border-color:#c25060}
button:disabled{opacity:.4}
.build{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.rsum{width:100%;max-width:380px;display:flex;flex-direction:column;gap:5px;align-items:stretch}.rsum h3{margin:6px 0 2px;font-size:13px;color:var(--muted);text-align:center;font-weight:normal}.rsum .build{align-self:center}
.dbar{display:grid;grid-template-columns:7.5em 1fr 3em;gap:8px;align-items:center;font-size:13px}.dbar .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}.dbar .dt{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.dbar .dt i{display:block;height:100%;background:#ffd24a}.dbar .dk{font-variant-numeric:tabular-nums;color:var(--muted)}
.chip{font-size:13px;padding:3px 9px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel)}
.devbtn{position:fixed;left:8px;bottom:calc(var(--sab) + 10px);z-index:6;pointer-events:auto;
  padding:6px 9px;font-size:12px;font-family:var(--f-mono);border-radius:7px;background:rgba(34,31,46,.8)}
.dev{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + 48px);
  max-width:420px;margin:0 auto;z-index:7;pointer-events:auto;background:rgba(14,12,20,.95);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.dev .g{display:flex;flex-wrap:wrap;gap:6px}
.dev button{padding:7px 10px;font-size:13px;border-radius:7px}
.dev button.on{background:#2d6a3c;border-color:#4caf6a}
.dev button.off{opacity:.4}
.dev pre{margin:8px 0 0;white-space:pre-wrap;color:#bcd9c0;font:12px/1.5 var(--f-mono)}
.rot{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;font-size:18px;text-align:center;padding:24px}
/* 시작·일시정지·결과 화면 (0.4) */
.layer.title{background:linear-gradient(180deg,rgba(12,10,18,.55),rgba(12,10,18,.88));gap:18px}
.ttl{text-align:center}
.ttl h1{margin:0 0 6px;font-size:40px;letter-spacing:2px;text-wrap:balance}
button.big{font-size:20px;padding:15px 0;width:min(260px,80vw)}
.menu{display:flex;flex-direction:column;gap:10px;width:min(260px,80vw)}
.menu button{width:100%}
button.warn{background:#6a2a34;border-color:#c25060;font-size:14px}
.hint{margin:0;color:var(--muted);font-size:14px;text-align:center}
.ver{position:absolute;bottom:calc(var(--sab) + 12px);right:16px;margin:0;color:var(--muted);font:12px var(--f-mono)}
.best{margin:0;color:#ffe08a;font-weight:700}
.pausebtn{position:fixed;top:calc(var(--sat) + 6px);right:8px;z-index:6;width:40px;height:40px;padding:0;
  font-size:15px;font-weight:800;border-radius:10px;background:rgba(34,31,46,.75);pointer-events:auto}
/* 대사창 틀 — 하단 고정 */
.dlg-wrap{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(var(--sab) + 18px)}
.dlg{display:flex;gap:12px;align-items:flex-start;width:100%;max-width:440px;min-height:112px;padding:12px;border-radius:14px;
  background:rgba(20,18,30,.94);border:1.5px solid var(--line);position:relative;cursor:pointer}
.dlg .pt{flex:0 0 64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#14121c}
.dlg .body{min-width:0;flex:1}
.dlg .nm{font-weight:700;font-size:15px;color:#ffe08a;margin-bottom:4px}
.dlg .tx{font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:keep-all}
.dlg .nx{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--muted)}
.dlg .pt{image-rendering:pixelated;border:1.5px solid var(--line)}
/* 서사·메뉴 (0.13~0.15) */
.frag{margin:0;color:#e8d8ff;font-weight:700;text-align:center;max-width:420px}
.score{margin:0;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.score small{font-size:13px;color:var(--muted);font-weight:600}
.layer.ending h2{font-size:32px;letter-spacing:2px}
#ui>.layer.scroll{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;background:rgba(14,12,22,.94)}
.layer.scroll>h2{margin-top:6vh}
#ui>.layer.fit{overflow-y:auto;touch-action:pan-y;justify-content:safe center}
.layer h3{margin:6px 0 0;font-size:16px;color:var(--muted);align-self:center}
.menu.row2{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(340px,90vw)}.menu.row2 button{flex:1;min-width:30%;white-space:nowrap;word-break:keep-all;padding:12px 8px}
.rows{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.row{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.row .rt span{font-size:13px;color:var(--muted)}
.row .tg{flex:0 0 auto;min-width:78px;padding:9px 10px;font-size:14px}
.row input[type=range]{flex:0 0 110px;accent-color:var(--accent)}.row output{width:30px;text-align:right;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;width:100%;max-width:420px}.tabs button{flex:1;padding:9px 4px;font-size:14px}
.cxl{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.cx{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.cx .ic{flex:0 0 36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#14121c}
.cx b{font-size:15px;margin-right:6px}.cx .tag{font-size:12px;color:var(--muted)}.cx p{margin:3px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);word-break:keep-all}
.cx.lock b{color:var(--muted)}
/* 0.34 도감 7탭·세부 수치 */
.tabs.cxt{display:grid;grid-template-columns:repeat(4,1fr)}.tabs.cxt button{padding:8px 2px;font-size:13px;white-space:nowrap}
.cx .cxb{flex:1;min-width:0}.cx .cxh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}.cx .cxh b{margin-right:0}
.cxl .cx p{overflow-wrap:anywhere;font-size:12.5px;line-height:1.45;margin-top:2px}.cx p i{font-style:normal;color:var(--fg);font-weight:700;font-size:12.5px}
.cx .tag.nw{color:#14121c;background:var(--muted);border-radius:6px;padding:0 5px}
.cxl .cx{display:block;padding:9px 10px}.cxt{display:flex;gap:9px;align-items:center}.cxt .cxb .cxh+p{margin-top:1px}
.cxs{display:flex;flex-wrap:wrap;gap:3px 4px;margin-top:4px}.cxs span{font-size:11.5px;line-height:1.3;background:var(--panel2);border-radius:5px;padding:2px 6px;color:var(--fg);white-space:nowrap}.cxs i{font-style:normal;color:var(--muted);margin-right:4px}.cx em{font-style:normal;color:#ffd24a;font-weight:700}
.cxg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}.cxg div{background:var(--panel2);border-radius:6px;padding:4px 6px;min-width:0}.cxg b{display:block;font-size:12px;margin:0;color:var(--fg)}.cxg span{display:block;font-size:11.5px;line-height:1.35;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.cxg span.u{margin-top:2px;color:#c8b8ff}
.cxr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px;font-size:12.5px}.cxr b{font-size:13px;margin:0}.cxm{display:inline-flex;align-items:center;gap:4px;color:var(--fg)}.ic.sm{width:20px;height:20px;flex:0 0 20px;border-radius:4px;font-size:11px}.ic.sm.px img{width:14px;height:14px}
.ic.px{border:2px solid;box-sizing:border-box;padding:0}.ic.px img{image-rendering:pixelated;display:block;width:24px;height:24px}.ab .ic.px img{width:21px;height:21px}.card .ic.px img{width:36px;height:36px}
.cx.dim{opacity:.55}.cx.dim .ic{filter:grayscale(.7)}
.cxl h3{align-self:flex-start;margin:10px 0 0}.cxl .hint{margin:0;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.chipb{padding:7px 11px;min-height:40px;font-size:13px;border-radius:20px;display:inline-flex;gap:6px;align-items:center}.chipb i{width:12px;height:12px;border-radius:50%;display:inline-block}
.card.armed{outline:3px solid #fff;outline-offset:1px}
@media (orientation:landscape) and (pointer:coarse){.rot{display:flex}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}

/* ===== 0.37 화면 다듬기 ===== */
button,.card,.chipb,.acc summary,.row.pick{transition:transform .2s,filter .2s,background-color .2s,border-color .2s,color .2s,opacity .2s}
button:active{transform:none}
button:not(:disabled):active,.acc summary:active{transform:scale(.95);filter:brightness(1.2)}
.card:not(:disabled):active,.row.pick:not(:disabled):active{transform:scale(.98);filter:brightness(1.15)}
@media (hover:hover){button:not(:disabled):hover,.acc summary:hover{filter:brightness(1.1)}}
/* 화면 진입: 0.2초 흐림·이동 */
/* 0.40: 화면 자체는 불투명도 유지(뒤 게임 화면 비침 방지), 내용만 0.2초 떠오름 */
#ui>.layer.enter>*:not(.pgh):not(.herobg):not(.heroshade){animation:lyIn .2s ease-out}
@keyframes lyIn{from{opacity:0;transform:translateY(6px)}}
/* 선택 카드 순차 올라옴 · 등급 칩 튀어오름 */
.layer.enter .cards>.card{animation:cdUp .26s ease-out both;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
.layer.enter .cards>.card .tag{animation:chipPop .3s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 55ms + 220ms)}
@keyframes cdUp{from{opacity:0;transform:translateY(16px)}}
@keyframes chipPop{from{opacity:0;transform:scale(.4)}}
.card.armed{box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 18px rgba(255,224,138,.35);animation:armP .22s ease-out}
@keyframes armP{40%{transform:scale(1.025)}}
.sub.armtip{color:#ffe08a;animation:chipPop .22s ease-out}
/* 확정 반짝임 */
.spark{position:fixed;width:0;height:0;z-index:40;pointer-events:none}
.spark i{position:absolute;left:-2px;top:-2px;width:5px;height:5px;background:var(--c);animation:spk .45s ease-out forwards}
.spark i:nth-child(1){--a:0deg}.spark i:nth-child(2){--a:60deg}.spark i:nth-child(3){--a:120deg}.spark i:nth-child(4){--a:180deg}.spark i:nth-child(5){--a:240deg}.spark i:nth-child(6){--a:300deg}
@keyframes spk{from{transform:rotate(var(--a)) translateX(6px);opacity:1}to{transform:rotate(var(--a)) translateX(38px) scale(.4);opacity:0}}
/* 첫 화면 히어로형 */
#ui>.layer.title.hero{padding:0;background:#15122e;overflow:hidden}
.herobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.heroshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,30,.35) 0%,rgba(14,12,30,0) 30%,rgba(14,12,30,0) 55%,rgba(14,12,22,.78) 100%);pointer-events:none}
.hlogo{position:absolute;left:0;right:0;top:calc(var(--sat) + 15vh);text-align:center;padding:0 16px}
.hlogo h1{margin:0;font-size:42px;letter-spacing:3px;color:#fff3d0;text-shadow:3px 3px 0 #3a2050,-1px -1px 0 #1b1626,1px -1px 0 #1b1626,-1px 1px 0 #1b1626,1px 1px 0 #1b1626}
.hlogo .best{margin-top:8px;text-shadow:2px 2px 0 #1b1626}
.hmenu{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 6vh);display:flex;flex-direction:column;align-items:center;gap:2px}
button.txb{background:none;border:none;border-radius:8px;padding:10px 30px;font-size:21px;line-height:1.25;color:#e8e0f4;text-shadow:2px 2px 0 #1b1626;letter-spacing:1px;white-space:nowrap}
button.txb.main{font-size:30px;color:#fff3d0;letter-spacing:4px;animation:breathe 2.4s ease-in-out infinite}
button.txb::before{content:'';display:inline-block;width:0;margin-right:0;transition:width .2s,margin .2s}
button.txb:active::before{width:.6em;margin-right:.2em;content:'▸'}
@keyframes breathe{50%{opacity:.72}}
.hmenu .hint{color:#d8d0ea;text-shadow:1px 1px 0 #1b1626;font-size:13px;margin-top:4px}
.layer.hero .ver{color:#c8c0dc;text-shadow:1px 1px 0 #1b1626}
.icb{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(20,18,32,.55);border:1px solid rgba(255,255,255,.16)}
.icb img{width:24px;height:24px;image-rendering:pixelated;display:block}
.icb.tl,.icb.tr{position:absolute;top:calc(var(--sat) + 12px)}.icb.tl{left:12px}.icb.tr{right:12px}
/* 고정 헤더 + 밀기 탭 */
#ui>.layer.pg{padding-top:0;gap:10px}
.pgh{position:sticky;top:0;z-index:3;align-self:stretch;margin:0 -16px;padding:calc(var(--sat) + 8px) 12px 0;background:rgba(16,14,24,.97);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pgt{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-bottom:4px}
.pgt h2{text-align:center;font-size:20px;margin:0}
.pgt .icb{background:transparent;border-color:transparent}
.pgh>.sub{margin:0 0 4px;font-size:13px}
.ptabs{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.ptabs button{background:none;border:none;border-radius:0;padding:9px 0 12px;font-size:14px;color:var(--muted);white-space:nowrap;min-width:0}
.ptabs button.on{color:var(--fg);font-weight:700}

button.row.pick.on{border-color:var(--accent);background:#2e2858}
/* 설정 스위치: 손잡이 이동 */

const WEAPONS = {

const WEAPON_ORDER = ['cleave', 'spin', 'shield', 'slam', 'arrow', 'boomerang', 'knife', 'trap', 'fireball', 'lightning', 'icering', 'orb'];
const START_WEAPON = 'cleave';
const START_POOL = ['cleave', 'spin', 'arrow', 'boomerang', 'fireball', 'lightning'];   // 0.24 시작 무기 3지선다 후보 (1단계 공용 무기 6종)

/* 보조 효과 8종 — 1단계 4종 + 3단계 4종, 단계당 효과, 최대 5단계 */
const PASSIVES = {

  /* 3단계 추가 4종 (0.8) */
  area: { name: '공격 범위', ic: '범', per: 0.08, desc: L => `모든 무기 범위 +${8 * L}%` },
  multi: { name: '투사체 수', ic: '투', per: 0.03, desc: L => `개수형 무기 개수 +${multiN(L)}, 해당 무기 피해 +${3 * L}%` },
  magnet: { name: '경험치 흡수', ic: '흡', per: 0.3, desc: L => `경험치 흡수 범위 +${30 * L}%` },

};
const PASSIVE_ORDER = ['vit', 'might', 'swift', 'haste', 'area', 'multi', 'magnet', 'regen'];
function multiN(L) { return L >= 5 ? 2 : L >= 2 ? 1 : 0; }   // 0.26 하향 (1→2단계부터 +1, 3→5단계에 +2)
/* ============================================================
   공용 함수 · 공간 격자 (초안 재사용, 명명 유지)
   ============================================================ */
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const lerp = (a, b, t) => a + (b - a) * t;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function weightedPick(items) { let s = 0; for (const it of items) s += it.w; let r = Math.random() * s; for (const it of items) { r -= it.w; if (r <= 0) return it; } return items[items.length - 1]; }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

const GRID = { cell: 64, map: new Map() };
function gkey(cx, cy) { return (cx + 32768) * 65536 + (cy + 32768); }
function gridBuild(list) {
  GRID.map.clear();
  for (const e of list) {
    if (e.dead) continue;
    const k = gkey(Math.floor(e.x / GRID.cell), Math.floor(e.y / GRID.cell));
    let a = GRID.map.get(k); if (!a) { a = []; GRID.map.set(k, a); } a.push(e);
  }
}
function gridQuery(x, y, r, cb) {
  const c = GRID.cell, x0 = Math.floor((x - r - 48) / c), x1 = Math.floor((x + r + 48) / c), y0 = Math.floor((y - r - 48) / c), y1 = Math.floor((y + r + 48) / c);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const a = GRID.map.get(gkey(cx, cy)); if (!a) continue;
    for (const e of a) { if (e.dead) continue; const rr = r + e.r; if (dist2(x, y, e.x, e.y) <= rr * rr) { if (cb(e) === false) return; } }
  }
}
function nearestEnemy(x, y, maxR = 600) {
  let best = null, bd = maxR * maxR;
  for (const e of G.enemies) { if (e.dead) continue; const d = dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
  return best;
}

/* 0.31 같은 화면 다시 그릴 때 스크롤 위치 유지 (설정·도전 준비·도감·선택 화면 토글 시 맨 위로 튀는 문제) */

/* ============================================================

const cv = document.getElementById('c');

const VIEW = { w: 400, h: 800, dpr: 1, zoom: 1, sat: 0, sab: 0, cw: 400, ch: 800 };
/* 0.26a 화면 고정: 캔버스·UI를 픽셀 고정 크기로 두어 창 크기가 순간 변해도 늘어남·재생성·재배치 없음
   (가장자리·상단 끌기 때 시스템 표시줄이 잠깐 나타나며 창 높이가 흔들리던 현상 대응)
   폭 변경(회전)·높이 확대는 즉시 반영, 높이 축소는 1.2초 이상 유지될 때만 반영 */
const uiEl = document.getElementById('ui');
function resize() {
  VIEW.dpr = Math.min(CFG.dprMax, window.devicePixelRatio || 1);
  VIEW.cw = window.innerWidth; VIEW.ch = window.innerHeight;
  cv.width = Math.round(VIEW.cw * VIEW.dpr); cv.height = Math.round(VIEW.ch * VIEW.dpr);
  cv.style.width = VIEW.cw + 'px'; cv.style.height = VIEW.ch + 'px';
  if (uiEl) { uiEl.style.width = VIEW.cw + 'px'; uiEl.style.height = VIEW.ch + 'px'; }
  VIEW.zoom = clamp(VIEW.cw / CFG.viewWidth, 0.8, 1.6);
  VIEW.w = VIEW.cw / VIEW.zoom; VIEW.h = VIEW.ch / VIEW.zoom;
  VIEW.sat = document.getElementById('sa').getBoundingClientRect().height || 0;
  VIEW.sab = document.getElementById('sb').getBoundingClientRect().height || 0;
  /* 0.27 화면 고정 보강: 안전 영역 값을 확정 시점에만 고정 반영, 상단 끌기 때 시스템 표시줄이 잠깐 나타나며
     안전 영역 값이 흔들려도 UI 재배치(레이아웃 재계산) 없음 */
  const rs = document.documentElement.style;
  rs.setProperty('--sat', VIEW.sat + 'px'); rs.setProperty('--sab', VIEW.sab + 'px');
}
let rsT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  const w = window.innerWidth, h = window.innerHeight;
  if (w !== VIEW.cw || h > VIEW.ch + 1) return resize();
  if (h === VIEW.ch) return;
  rsT = setTimeout(() => { if (window.innerWidth === w && window.innerHeight === h) resize(); }, 1200);
});

const INPUT = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0, keys: {} };
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (STATE.mode !== 'play' || INPUT.active) return;
  INPUT.active = true; INPUT.id = e.pointerId;
  INPUT.ox = INPUT.x = e.clientX; INPUT.oy = INPUT.y = e.clientY;
  if (SETTINGS.joy === 'fixed') { const f = joyFixed(); INPUT.ox = f.x; INPUT.oy = f.y; }   // 고정형: 화면 아래 중앙 기준 (0.14)
  updJoy();

function phaseBias() { const P = curPhase(); return !G.ph.inGap && P && P.bias || null; }

function phaseStart() {
  const ph = G.ph; ph.i++; ph.id = ph.order[ph.i]; ph.t = 0; ph.inGap = false; ph.acc = 0; ph.k0 = G.kills;
  ph.ambush = !!ph.nextAmbush && REST_PH.includes(ph.id); ph.nextAmbush = false;
  const P = PHASES[ph.id], A = ph.ambush ? AMBUSH[ph.id] : null;
  scheduleElites();
  if (ph.id !== 'gate' && ph.id !== 'demon') banner(A ? A.name : P.name, `${ph.i + 1}/${ph.order.length} · ${A ? A.hint : P.hint}`, A ? '#ff8a6a' : undefined);   // 페이즈 전환 알림판 (0.22)

  if (ph.id === 'calm') { const q = ringAt(180, 260); ph.spring = { x: q.x, y: q.y, r: 22, used: false }; }
  if (ph.id === 'seal') { ph.zone = newZone(0); }
  if (ph.id === 'warband') {
    const q = ringPos(20), e = makeEnemy('brute', q.x, q.y);
    e.hp = e.maxHp = e.hp * PH_CFG.cmdHp; e.r = PH_CFG.cmdR; e.dmg *= 1.3; e.speed *= 1.35; e.color = '#e8a83c'; e.xp = 30; e.cmd = true;
    ph.cmd = e;
  }

  if (ph.id === 'siege') ph.siegeT = PH_CFG.siegeFirst;
  if (ph.id === 'collapse') { ph.cracks = []; ph.crackT = 1.5; }
  if (ph.id === 'camp') { const q = ringAt(PH_CFG.campDist[0], PH_CFG.campDist[1]); ph.camp = { x: q.x, y: q.y, r: PH_CFG.campR, used: false }; }
  if (ph.id === 'escort') {
    const a = rand(Math.PI * 2), sx = G.p.x + Math.cos(a + 1.6) * 60, sy = G.p.y + Math.sin(a + 1.6) * 60;
    ph.cart = { x: sx, y: sy, tx: sx + Math.cos(a) * PH_CFG.cartDist, ty: sy + Math.sin(a) * PH_CFG.cartDist, hp: PH_CFG.cartHp, maxHp: PH_CFG.cartHp, r: PH_CFG.cartR, d0: PH_CFG.cartDist, hit: 0 };

function ringAt(a, b) { const ang = rand(Math.PI * 2), R = rand(a, b); return { x: G.p.x + Math.cos(ang) * R, y: G.p.y + Math.sin(ang) * R }; }
function newZone(i) { const q = ringAt(PH_CFG.zoneDist[0], PH_CFG.zoneDist[1]); return { x: q.x, y: q.y, r: PH_CFG.zoneR, prog: 0, i }; }

  ph.cmd = null;

  if (ph.id === 'gate' && outcome === 'ok' && G.runType === 'final') {   // 4번째 문 개방 → 마왕성 출현, 같은 판에서 마왕전 (0.12)
    ph.order.push('demon'); G.eb = []; G.hz = [];
    toast(`${GATEKEEPERS[G.gk].name} 처치 · 네 문 개방`, '#ffe08a'); toast('마왕성 출현', '#c9a8ff');

      G.result = 'retreat'; G.endT = 1.6; toast('마왕성 소멸 · 회귀', '#c9a8ff');

    sfx('clear'); G.result = 'clear'; G.endT = 1.6; toast(ph.id === 'gate' ? `${GATEKEEPERS[G.gk].name} 처치 · ${GATEKEEPERS[G.gk].gate} 개방` : '들판 돌파', '#ffe08a');

  ph.inGap = true; ph.gapT = PH_CFG.gap; ph.id = null; ph.ambush = false;

  altarCheck();

function updatePhase(dt) {
  const ph = G.ph, p = G.p;
  // 색감 전환 (예고 구간에 다음 페이즈 색으로 이동)
  if (ph.tintK < 1) ph.tintK = Math.min(1, ph.tintK + dt / 2);
  if (ph.inGap) {
    ph.gapT -= dt;
    const nx = ph.order[ph.i + 1];
    if (nx && ph.gapT <= PH_CFG.warnAt && !ph.warned) {
      ph.warned = true; ph.tintFrom = ph.tint; ph.tint = ph.nextAmbush ? [200, 70, 60] : PHASES[nx].tint; ph.tintK = 0;
      toast('다음: ' + phaseName(nx, ph.nextAmbush), ph.nextAmbush ? '#ff9a7a' : '#cfc6ff');
    }
    if (ph.gapT <= 0) { ph.warned = false; phaseStart(); }
    return;
  }
  const P = PHASES[ph.id], dk = G.kills - ph.k0; ph.k0 = G.kills;
  if (!eventPaused()) {
    ph.t += dt;          // 곁가지 사건 진행 중 페이즈 타이머 정지 (3단계 결정 안건 6)
    if (P.goal === 'time' && (ph.ambush || !REST_PH.includes(ph.id)) && dk > 0) {   // 0.24 처치 가속 (휴식형 제외, 습격 변형 포함)
      const b = Math.min(dk * PH_CFG.accPerKill, P.dur * PH_CFG.accMax - ph.acc);
      if (b > 0) { ph.t += b; ph.acc += b; ph.accT = 0.6; }
    }
  }
  if (ph.accT > 0) ph.accT -= dt;
  ph.hurtEma *= Math.max(0, 1 - dt / 40);
  updatePhaseGimmick(P, dt);
  if (G.result) return;
  if (P.goal === 'hunt' && ph.hunt >= PH_CFG.huntN) return phaseEnd('ok');
  if (P.goal === 'escort' && ph.cart) { if (ph.cart.hp <= 0) return phaseEnd('fail'); if (ph.cart.done) return phaseEnd('ok'); }
  if (P.goal === 'ritual' && ph.rits && ph.rits.every(e => e.dead)) return phaseEnd('ok');
  if (P.goal === 'time' && ph.t >= P.dur) return phaseEnd('ok');
  if (P.fail && ph.t >= P.fail) return phaseEnd('timeout');
  if (ph.spring && !ph.spring.used && dist2(p.x, p.y, ph.spring.x, ph.spring.y) < (ph.spring.r + p.r) ** 2) {
    ph.spring.used = true; heal(p.maxHp * PH_CFG.springHeal, '회복의 샘'); toast('회복의 샘', '#8ff0b0');
    fx({ kind: 'ring', x: ph.spring.x, y: ph.spring.y, r0: 8, r1: 60, dur: 0.5, color: '#8ff0b0' });
  }
  if (P.goal === 'kill' && ph.cmd && ph.cmd.dead && ph.t >= (P.min || 0)) return phaseEnd('ok');
  if (P.goal === 'boss' && G.gkMob && G.gkMob.dead) return phaseEnd('ok');
  if (P.goal === 'zone' && ph.zone) {
    const z = ph.zone;
    if (dist2(p.x, p.y, z.x, z.y) < z.r * z.r) z.prog += dt;
    if (z.prog >= PH_CFG.zoneNeed) {
      fx({ kind: 'ring', x: z.x, y: z.y, r0: z.r * 0.5, r1: z.r * PH_CFG.zonePush, dur: 0.6, color: '#9fc4ff' });
      sealPulse(z);
      if (z.i + 1 >= PH_CFG.zoneN) { ph.zone = null; return phaseEnd('ok'); }
      ph.zone = newZone(z.i + 1); toast(`봉인석 ${z.i + 1}/${PH_CFG.zoneN} 해제`, '#9fc4ff');
    }
  }
}

/* 봉인석 해제 파동 — 주변 적 밀어내기 (0.3a, 해제 직후 포위 상태 탈출 보조) */
function sealPulse(z) {
  const R = z.r * PH_CFG.zonePush;
  gridQuery(z.x, z.y, R, e => { if (e.cmd || e.dead) return; const dx = e.x - z.x, dy = e.y - z.y, d = Math.hypot(dx, dy) || 1; e.kbx += dx / d * PH_CFG.zoneKb; e.kby += dy / d * PH_CFG.zoneKb; });
}

/* ============================================================
   0.10 추가 페이즈 기믹 갱신
   ============================================================ */
function updatePhaseGimmick(P, dt) {
  const ph = G.ph, p = G.p, paused = eventPaused(), min = G.time / 60;
  // 엘리트 사냥: 정해진 시각에 정예 출현 (개별 보상 없음, 완료 시 상자 1개)
  if (ph.id === 'hunt' && ph.huntQ && ph.huntQ.length && ph.t >= ph.huntQ[0]) { ph.huntQ.shift(); const e = spawnElite(); e.noChest = true; e.hunt = true; }
  // 포위진: 주기적 원형 포위
  if (ph.id === 'siege' && !paused) {
    ph.siegeT -= dt;
    if (ph.siegeT <= 0) {
      ph.siegeT = PH_CFG.siegeEvery;
      const n = Math.max(0, Math.min(PH_CFG.siegeN, CFG.spawn.max - aliveCount())), a0 = rand(Math.PI * 2);
      for (let i = 0; i < n; i++) { const a = a0 + i * Math.PI * 2 / n; makeEnemy(min > 3 && i % 3 === 0 ? 'skel' : 'slime', p.x + Math.cos(a) * PH_CFG.siegeR, p.y + Math.sin(a) * PH_CFG.siegeR); }
      toast('포위 압축', '#e0a0c0');
    }
  }
  // 붕괴 지대: 예고 원 → 붕괴 (플레이어 피해)
  if (ph.id === 'collapse') {
    if (!paused) { ph.crackT -= dt; if (ph.crackT <= 0) { ph.crackT = PH_CFG.crackEvery; spawnCracks(); } }
    for (const k of ph.cracks) {
      k.t += dt;
      if (k.t >= PH_CFG.crackWarn && !k.done) {
        k.done = true; fx({ kind: 'ring', x: k.x, y: k.y, r0: k.r * 0.4, r1: k.r * 1.1, dur: 0.35, color: '#c09060' });
        if (dist2(p.x, p.y, k.x, k.y) < (k.r + p.r * 0.5) ** 2) hurtPlayer(PH_CFG.crackDmg * (1 + CFG.scale.dmgPerMin * min), '붕괴 지대');
      }
    }
    ph.cracks = ph.cracks.filter(k => k.t < PH_CFG.crackWarn + 0.35);
  }
  // 떠돌이 야영지: 접촉 시 보상 1회 선택
  if (ph.camp && !ph.camp.used && dist2(p.x, p.y, ph.camp.x, ph.camp.y) < (ph.camp.r + p.r) ** 2) { ph.camp.used = true; G.pendingCamp = true; }
  // 수레 호위 (0.24 재설계): 수레는 스스로 전진, 적 일부가 수레를 노리고 돌진, 붙은 적 수만큼 감속·손상
  const c = ph.cart;
  if (c && !c.done) {
    let n = 0, hurt = 0;
    gridQuery(c.x, c.y, c.r + 18, e => { if (e.fixed || e.sleep || e.dead || n >= PH_CFG.cartHurtMax) return; if (dist2(e.x, e.y, c.x, c.y) < (e.r + c.r + 2) ** 2) { n++; hurt += e.dmg; } });
    c.block = n; c.sp = paused ? 0 : PH_CFG.cartSpeed * Math.max(0, 1 - n * PH_CFG.cartBlock); c.moving = c.sp > 0;
    if (c.moving) { const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy); if (d < 8) { c.done = true; } else { c.x += dx / d * c.sp * dt; c.y += dy / d * c.sp * dt; } }
    if (hurt) { c.hp -= hurt * PH_CFG.cartHurt * dt; c.hit = 0.15; }
    if (!c.warned && c.hp <= c.maxHp * PH_CFG.cartWarn) { c.warned = true; toast('수레 위험 · 체력 30% 이하', '#ff6a4a'); sfx('preview'); }   // 0.31 수레 위험 경고
    c.hit -= dt;
  }
  // 의식 저지: 남은 마법진마다 주기 소환
  if (ph.rits && !paused) for (const e of ph.rits) {
    if (e.dead) continue; e.sumT -= dt;
    if (e.sumT <= 0) { e.sumT = PH_CFG.ritEvery; for (let i = 0; i < PH_CFG.ritSummon; i++) { if (aliveCount() >= CFG.spawn.max) break; const a = rand(Math.PI * 2); makeEnemy(min > 1.5 ? 'skel' : 'slime', e.x + Math.cos(a) * 34, e.y + Math.sin(a) * 34); } }
  }

function spawnCracks() {
  const p = G.p, mv = p.moving ? p.face : { x: 0, y: 0 };
  for (let i = 0; i < PH_CFG.crackN; i++) {
    const q = i === 0 ? { x: p.x + mv.x * 70 + rand(-20, 20), y: p.y + mv.y * 70 + rand(-20, 20) } : ringAt(60, 220);

/* 엘리트 사냥 처치 집계 (growth.js eliteKilled에서 호출) */
function phaseEliteKilled(e) { if (e.hunt && G.ph.id === 'hunt') G.ph.hunt++; }
/* 페이즈 종료 정리·보상 */
function phaseCleanup(outcome) {
  const ph = G.ph, id = ph.id, p = G.p;
  if (outcome === 'ok' && (id === 'hunt' || id === 'escort' || id === 'ritual')) {
    const at = id === 'escort' && ph.cart ? ph.cart : ringAt(40, 70);
    G.chests.push({ x: at.x, y: at.y, r: 14 }); toast('완수 보상 · 보물 상자', '#ffd24a');
  }
  if (id === 'ritual' && ph.rits) {
    const left = ph.rits.filter(e => !e.dead);
    for (const e of left) { e.dead = true; fx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: 70, dur: 0.5, color: '#b080ff' }); }
    if (left.length) { spawnElite(); toast('의식 완성 · 정예 소환', '#c8a0ff'); }
  }
  if (id === 'hunt') for (const e of G.enemies) if (e.hunt && !e.dead) e.hunt = false;
  if (id === 'escort' && outcome !== 'ok') {                // 0.31 수레 실패: 정예 2체 습격, 보물 상자 없음
    toast('수레 파손 · 정예 습격', '#ff9a7a');
    for (let i = 0; i < PH_CFG.cartFailElites; i++) { const e = spawnElite(); e.noChest = true; e.cartRaid = true; }
    G.stats.cartFail = (G.stats.cartFail || 0) + 1;
  }
  ph.cart = null; ph.rits = null; ph.cracks = []; ph.camp = null; ph.huntQ = null;
}

/* 진행도(0~1) — 상단 표시용 */
function phaseProgress() {
  const ph = G.ph, P = curPhase(); if (!P) return 0;
  if (P.goal === 'time') return Math.min(1, ph.t / P.dur);
  if (P.goal === 'boss') return G.gkMob ? 1 - Math.max(0, G.gkMob.hp) / G.gkMob.maxHp : 0;
  if (P.goal === 'kill') return ph.cmd ? 1 - Math.max(0, ph.cmd.hp) / ph.cmd.maxHp : 1;
  if (P.goal === 'zone') return ph.zone ? (ph.zone.i + ph.zone.prog / PH_CFG.zoneNeed) / PH_CFG.zoneN : 1;
  if (P.goal === 'hunt') return ph.hunt / PH_CFG.huntN;
  if (P.goal === 'escort') return ph.cart ? 1 - Math.hypot(ph.cart.tx - ph.cart.x, ph.cart.ty - ph.cart.y) / ph.cart.d0 : 1;
  if (P.goal === 'ritual') return ph.rits ? ph.rits.filter(e => e.dead).length / PH_CFG.ritN : 1;
  return 0;
}

/* 지면 위 표시: 봉인석 구역·회복의 샘 */

  }

    c.strokeStyle = 'rgba(190,140,255,0.7)'; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, e.r + 14 + Math.sin(G.time * 3) * 3, 0, 7); c.stroke();
    c.save(); c.translate(e.x, e.y); c.rotate(G.time); c.beginPath(); for (let i = 0; i < 5; i++) { const a = i * Math.PI * 4 / 5; c.lineTo(Math.cos(a) * (e.r + 10), Math.sin(a) * (e.r + 10)); } c.closePath(); c.stroke(); c.restore();
  }
  if (ph.camp && !ph.camp.used) {

    drawSprite(c, 'tent', 0, m.x, m.y + 14, { mul: 2 }); drawSprite(c, 'fire2', f2(6), m.x + 30, m.y + 22, { mul: 2 });   // 0.30 천막·모닥불 도트
  }

function dmUpdate(e, dt, d, dx, dy) {
  const p = G.p, ai = e.ai;
  if (G.result) return;
  if (G.tm.stop > 0) dt *= 0.3;
  if (e.frz > 0) e.frz = 0;
  // 페이즈 전환
  const nx = e.st < 2 && e.hp <= e.maxHp * DM_CFG.stages[e.st];
  if (nx) {
    (G.stats.demon.tr || (G.stats.demon.tr = [])).push([e.id, e.st, Math.round(G.time - e.stT0), Math.round(e.hp / e.maxHp * 100), G.gkMob === e ? 1 : 0]);   // 전환 추적 (0.18 조기 전환 원인 확인)
    e.st++; e.stT0 = G.time; e.stun = DM_CFG.stun; ai.cd = DM_CFG.stun + 0.5; ai.blink = null; G.eb = []; G.hz = G.hz.filter(h => h.k === 'arena');
    G.stats.demon.st[e.st - 1] = Math.round(G.time - G.stats.demon.t0);
    toast(e.st === 1 ? '암흑 결계' : '종언', '#c9a8ff'); fx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: 280, dur: 1.0, color: '#c9a8ff' });
    if (e.st === 1) G.arena = { x: p.x, y: p.y, R: DM_CFG.arR0, t: 0, tick: 0 };
  }
  if (e.stun > 0) { e.stun -= dt; if (Math.random() < dt * 10) fx({ kind: 'ring', x: e.x + rand(-14, 14), y: e.y + rand(-14, 14), r0: 4, r1: 22, dur: 0.35, color: '#c9a8ff' }); }   // 0.31 전환 공격 정지 연출
  else if (G.time - e.stT0 > DM_CFG.stTgt[e.st]) {               // 잠식 (0.18): 목표 시간 초과 시 체력 자연 감소, 페이즈 경계에서 정지
    const loss = e.maxHp * DM_CFG.seg[e.st] / DM_CFG.erode * dt, floor = e.st < 2 ? e.maxHp * DM_CFG.stages[e.st] : 0;
    e.hp = Math.max(floor, e.hp - loss); if (e.st === 2 && e.hp <= 0) { killEnemy(e); return; }
  }
  let mv = 1;
  if (ai.blink) {                                                // 그림자 도약: 예고 후 착지
    ai.blink.t -= dt; mv = 0;
    if (ai.blink.t <= 0) { e.x = ai.blink.x; e.y = ai.blink.y; ai.blink = null; fx({ kind: 'ring', x: e.x, y: e.y, r0: 10, r1: DM_CFG.blR, dur: 0.4, color: '#b080ff' }); }
  } else if (!(e.stun > 0)) {
    ai.cd -= dt;
    if (ai.cd <= 0) { ai.cd = DM_CFG.every[e.st]; ai.n++; mv = dmPattern(e, ai); }
  }
  // 이동: 1페이즈 중거리 압박, 2·3페이즈 원거리 유지 (결계 안 제한)
  if (e.stun > 0) mv = 0;
  if (mv && !ai.blink) {
    const lo = e.st ? 170 : 110, hi = e.st ? 250 : 180;
    gkKeep(e, d, 0, lo, hi);
    const s = e.strafe, mx = dx / d, my = dy / d;
    let sx = mx * s.k - my * s.dir * (1 - Math.abs(s.k)), sy = my * s.k + mx * s.dir * (1 - Math.abs(s.k)); const m = Math.hypot(sx, sy) || 1;
    const sp = e.speed * (e.st === 2 ? 1.2 : 1) * (e.slowT > 0 ? 0.75 : 1) * (G.tm.roar > 0 ? 0.6 : 1) * mv;
    e.x += sx / m * sp * dt; e.y += sy / m * sp * dt;
  }
  if (e.slowT > 0) e.slowT -= dt;
  const A = G.arena;
  if (A) {                                                        // 결계 안으로 제한
    const ax = e.x - A.x, ay = e.y - A.y, ad = Math.hypot(ax, ay);
    if (ad > A.R - e.r) { e.x = A.x + ax / ad * (A.R - e.r); e.y = A.y + ay / ad * (A.R - e.r); }
  } else if (d > Math.hypot(VIEW.w, VIEW.h) * 0.8 && !ai.blink) { const q = ringAt(VIEW.w * 0.5, VIEW.w * 0.6); e.x = q.x; e.y = q.y; }
  if (d < e.r + p.r - 3) hurtPlayer(e.dmg, '마왕');
}

/* 패턴 선택 — 반환값: 패턴 직후 이동 배율 */
function dmPattern(e, ai) {
  const p = G.p, st = e.st, k = ai.n;
  const r = bpNext(ai, [['scythe', 'homing', 'blink', 'hands'], ['beams', 'scho', 'blink', 'wave'], ['beho', 'meteor', 'blsc', 'split']][st]);   // 0.33 순번표 + 페이즈 전용 신규 1종
  if (r === 'hands') { bpHands(e); return 0.5; }
  if (r === 'wave') { bpWave(e); return 0.3; }
  if (r === 'split') { bpSplit(e); return 0.4; }
  if (st === 0) {
    if (r === 'scythe') { dmScythe(e); return 0.3; }
    if (r === 'homing') { dmHoming(e); return 0.6; }
    dmBlink(e); return 0;
  }
  if (st === 1) {
    if (r === 'beams') { dmBeams(e); return 0.2; }
    if (r === 'scho') { dmScythe(e); dmHoming(e, 2); return 0.4; }
    dmBlink(e); return 0;
  }
  if (r === 'beho') { dmBeams(e); dmHoming(e); return 0.2; }
  if (r === 'meteor') { dmMeteors(e); return 0.5; }
  dmBlink(e); G.later.push({ t: DM_CFG.blWarn + 0.15, f: () => { if (!e.dead && !G.result) dmScythe(e); } }); return 0;
}
function dmScythe(e) {
  const p = G.p, a = Math.atan2(p.y - e.y, p.x - e.x);
  G.hz.push({ k: 'sect', x: e.x, y: e.y, a, arc: DM_CFG.scArc, r: DM_CFG.scR, warn: DM_CFG.scWarn[e.st], t: 0, dmg: gkDmg(DM_CFG.scDmg), src: '마왕 낫', follow: e });
}
function dmHoming(e, n) {
  const p = G.p, N = n || DM_CFG.hoN[e.st], base = Math.atan2(p.y - e.y, p.x - e.x);
  for (let i = 0; i < N; i++) {
    const a = base + Math.PI + (i / Math.max(1, N - 1) - 0.5) * 2.4;     // 등 뒤로 퍼진 뒤 선회해 추적
    if (G.eb.length < 260) G.eb.push({ x: e.x, y: e.y, vx: Math.cos(a) * DM_CFG.hoSp, vy: Math.sin(a) * DM_CFG.hoSp, r: 8, dmg: gkDmg(DM_CFG.hoDmg), src: '마왕 혼령', life: DM_CFG.hoLife, col: '#c9a8ff', home: DM_CFG.hoTurn });
  }
}
function dmBlink(e) {
  const p = G.p, a = Math.atan2(p.y - e.y, p.x - e.x) + rand(-0.6, 0.6);
  let x = p.x + Math.cos(a) * DM_CFG.blDist, y = p.y + Math.sin(a) * DM_CFG.blDist;   // 플레이어 너머로 도약
  const A = G.arena; if (A) { const ax = x - A.x, ay = y - A.y, ad = Math.hypot(ax, ay); if (ad > A.R - e.r) { x = A.x + ax / ad * (A.R - e.r); y = A.y + ay / ad * (A.R - e.r); } }
  e.ai.blink = { x, y, t: DM_CFG.blWarn };
  gkCircle(x, y, DM_CFG.blR, DM_CFG.blWarn, gkDmg(DM_CFG.blDmg), '마왕 도약');
}
function dmBeams(e) {
  const n = DM_CFG.bmN[e.st], a0 = rand(6.28), dir = Math.random() < 0.5 ? 1 : -1;
  for (let i = 0; i < n; i++) G.hz.push({ k: 'beam', x: e.x, y: e.y, a: a0 + i * 6.283 / n, rot: DM_CFG.bmRot[e.st] * dir, len: DM_CFG.bmLen, w: DM_CFG.bmW, warn: DM_CFG.bmWarn, dur: DM_CFG.bmDur[e.st], t: 0, dmg: gkDmg(DM_CFG.bmDmg), src: '마왕 광선', follow: e, tick: 0 });
}
function dmMeteors(e) {
  for (let i = 0; i < DM_CFG.mtN; i++) G.later.push({ t: i * DM_CFG.mtGap, f: () => {
    if (e.dead || G.result) return; const p = G.p, lead = 0.5;              // 이동 방향 앞쪽 예측 낙하
    const v = p.moving ? CFG.player.speed * p.mod.speed * lead : 0;
    gkCircle(p.x + p.face.x * v + rand(-25, 25), p.y + p.face.y * v + rand(-25, 25), DM_CFG.mtR, DM_CFG.mtWarn, gkDmg(DM_CFG.mtDmg), '마왕 운석');
  } });
}

/* 결계·광선·부채꼴·추적탄 갱신 — updateBossFx에서 호출 */
function dmFx(dt) {
  const p = G.p, A = G.arena;
  if (A) {
    A.t += dt; A.R = DM_CFG.arR0 - (DM_CFG.arR0 - DM_CFG.arR1) * Math.min(1, A.t / DM_CFG.arShrink);
    A.tick -= dt;
    if (A.tick <= 0) { A.tick = 0.5; if (!G.result && dist2(p.x, p.y, A.x, A.y) > (A.R - p.r * 0.5) ** 2) hurtPlayer(gkDmg(DM_CFG.arDmg), '마왕 결계'); }
  }
  for (const b of G.eb) if (b.home) {
    const want = Math.atan2(p.y - b.y, p.x - b.x), cur = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy);
    let da = want - cur; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
    const na = cur + Math.max(-b.home * dt, Math.min(b.home * dt, da)); b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
  }
  for (const h of G.hz) {
    if (h.k === 'sect') {
      if (h.follow && !h.fired) { h.x = h.follow.x; h.y = h.follow.y; }
      if (h.t >= h.warn && !h.fired) {
        h.fired = true; fx({ kind: 'ring', x: h.x, y: h.y, r0: h.r * 0.5, r1: h.r, dur: 0.3, color: '#b080ff' });
        if (!G.result && dmInSect(h, p.x, p.y, p.r * 0.5)) hurtPlayer(h.dmg, h.src);
      }
    } else if (h.k === 'beam') {
      if (h.follow && !h.follow.dead) { h.x = h.follow.x; h.y = h.follow.y; }
      if (h.t > h.warn) {
        h.a += h.rot * dt; h.tick -= dt;
        if (h.tick <= 0 && !G.result && dmOnBeam(h, p.x, p.y, p.r * 0.5)) { h.tick = 0.25; hurtPlayer(h.dmg, h.src); }
      }
    }
  }
}
function dmInSect(h, x, y, pad) {
  const dx = x - h.x, dy = y - h.y, d = Math.hypot(dx, dy); if (d > h.r + pad) return false;
  let da = Math.atan2(dy, dx) - h.a; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
  return Math.abs(da) <= h.arc / 2 || (d < 30 && !h.noCore);   // 0.33 분할 낙하는 중심 판정 없음
}
function dmOnBeam(h, x, y, pad) {
  const ux = Math.cos(h.a), uy = Math.sin(h.a), rx = x - h.x, ry = y - h.y, al = rx * ux + ry * uy;
  return al > 0 && al < h.len && Math.abs(rx * uy - ry * ux) < h.w / 2 + pad;
}
function dmHzAlive(h) { return h.k === 'sect' ? h.t < h.warn + 0.3 : h.t < h.warn + h.dur; }

/* 받는 피해 보정 (damageEnemy에서 호출, 0.16 → 0.31): 체력 하한 고정 폐지(체력 0 즉시 처치), 목표 시간 초과 시 피해 점증, 초당 감소 상한 */
function dmAdjust(e, dmg) {
  if (e.stT0 == null) e.stT0 = G.time;
  const el = G.time - e.stT0;
  if (el > DM_CFG.stTgt[e.st]) dmg *= Math.min(DM_CFG.catchMax, 1 + (el - DM_CFG.stTgt[e.st]) * DM_CFG.catchUp);
  const t = G.time, bud = e.bud == null ? e.maxHp * DM_CFG.burst : e.bud;   // 초당 감소 상한: 예산은 시간에 따라 충전, 정지 없이 체력 막대가 꾸준히 감소
  e.bud = Math.min(e.maxHp * DM_CFG.burst, bud + (t - (e.budT == null ? t : e.budT)) * e.maxHp * DM_CFG.rate); e.budT = t;
  dmg = Math.min(dmg, e.bud); e.bud -= dmg;
  return dmg;
}

/* 그리기: 부채꼴·광선 예고(지면), 결계(화면 외곽 암전) */
function drawDemonGround(c) {
  const A = G.arena;
  if (A) {
    c.strokeStyle = 'rgba(30,8,50,0.62)'; c.lineWidth = 900; c.beginPath(); c.arc(A.x, A.y, A.R + 450, 0, 7); c.stroke();
    c.strokeStyle = 'rgba(190,140,255,0.85)'; c.lineWidth = 3; c.beginPath(); c.arc(A.x, A.y, A.R, 0, 7); c.stroke();
    drawArenaPillars(c, A);                                                          // 0.30 결계 기둥 도트
  }
  for (const h of G.hz) {
    const a = Math.min(1, h.t / h.warn);
    if (h.k === 'sect' && !h.fired) {
      c.fillStyle = `rgba(150,70,230,${0.12 + 0.25 * a})`; c.beginPath(); c.moveTo(h.x, h.y); c.arc(h.x, h.y, h.r, h.a - h.arc / 2, h.a + h.arc / 2); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(200,150,255,0.9)'; c.lineWidth = 2; c.stroke();
      drawWarnMark(c, h.x + Math.cos(h.a) * h.r * 0.55, h.y + Math.sin(h.a) * h.r * 0.55, a);   // 0.30 위험 표식
    } else if (h.k === 'beam') {
      c.save(); c.translate(h.x, h.y); c.rotate(h.a);
      if (h.t <= h.warn) { c.fillStyle = `rgba(190,120,255,${0.15 + 0.2 * a})`; c.fillRect(0, -2, h.len, 4); }
      else { c.fillStyle = 'rgba(170,90,255,0.35)'; c.fillRect(0, -h.w / 2 - 4, h.len, h.w + 8); }
      c.restore();
      if (h.t > h.warn) drawDemonBeam(c, h);                                         // 0.30 광선 도트 마디
    }
  }
}

function startLine(s) {

}

const toLines = arr => arr.map(([who, text]) => CAST[who] ? { name: CAST[who].name, color: CAST[who].color, pt: CAST[who].pt, text } : who);
function storyRead() { const s = loadSave(); s.frags = s.frags || []; return s; }
function storyWrite(s) { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(s)); } catch (e) { } }

/* 판 시작 (step 첫 틱에서 호출) — 대사 표시 시 true */
function storyRunStart() {
  const s = storyRead(); let lines;
  G.story = { freed: !!s.released && !s.trueEnd, newFrags: [] };
  if (!s.intro) { s.intro = 1; storyWrite(s); lines = SAY.intro; }
  else if (s.frags.length >= FRAG_N && !s.released && !s.trueEnd) { s.released = 1; storyWrite(s); G.story.freed = true; lines = SAY.release; }
  else lines = [startLine(s)];
  showDialog(toLines(lines));
  return true;
}
/* 기록 조각 해금 — 즉시 저장 */
function fragUnlock(id) {
  if (!G || !G.story) return;
  const s = storyRead(); if (s.frags.includes(id)) return;
  s.frags.push(id); storyWrite(s); G.story.newFrags.push(id);
  const F = FRAGS.find(f => f.id === id);
  toast(`기록 조각 · ${F.nm} (${s.frags.length}/${FRAG_N})`, '#e8d8ff');
}
/* 보스 등장 대사 — 수문장은 첫 대면만, 마왕은 첫 대면·해제 판 */
function storyBoss(k) {
  vibe(80);
  const s = storyRead();
  if (k === 'demon') {
    fragUnlock('castle');
    if (G.story && G.story.freed) return showDialog(toLines(SAY.demonFree));
    if (!s.demonTries && !s.metDemon) { const t = storyRead(); t.metDemon = 1; storyWrite(t); return showDialog(toLines(SAY.demonMeet)); }   // 0.16: 조각 해금 직후 재읽기 (이전 사본 저장 시 '왕좌로 가는 계단' 조각 유실 결함)
    return;
  }
  s.metGk = s.metGk || [];
  if (s.metGk.includes(k)) return;
  s.metGk.push(k); storyWrite(s);
  const D = GATEKEEPERS[k];
  showDialog([{ name: D.name, color: D.color, text: GK_SAY[k] }]);
}
/* 판 종료 대사 (finishRun에서 저장 전에 호출) — 저장 항목 갱신 후 표시 함수 반환 (next: 결과 화면) */
function storyRunEnd(s, next) {
  const R = G.report, dm = R.demon, killed = dm && dm[0] === 'kill';
  const say = (arr, after) => () => showDialog(toLines(arr), after || next);
  if (killed && G.story && G.story.freed) { s.trueEnd = 1; s.released = 0; R.trueEnd = true; return say(SAY.trueEnd, () => showEnding(next)); }
  if (killed && !s.ending1) { s.ending1 = 1; R.ending1 = true; return say(SAY.ending1); }
  if (killed && !s.trueEnd) return say(SAY.demonAgain);
  if (R.result === 'dead' && (s.runs || 0) <= 1) return say(SAY.firstDeath);
  if (R.gate && R.gate[1] === 'kill' && !dm) return say([['hero', `${GATEKEEPERS[R.gate[0]].gate}이 열렸다. 남은 문은 ${Math.max(0, 4 - (s.gates || []).length)}개.`]]);
  return next;
}

];
const META = (() => { try { return Object.assign({ tier: 0, conds: [] }, JSON.parse(localStorage.getItem(CFG.SAVE_KEY + '_run') || '{}')); } catch (e) { return { tier: 0, conds: [] }; } })();
function saveMeta() { try { localStorage.setItem(CFG.SAVE_KEY + '_run', JSON.stringify({ tier: META.tier, conds: META.conds })); } catch (e) { } }
/* 판 시작 시 적용 옵션 — 진엔딩 전에는 항상 기본 */
function runOpt() {
  const s = loadSave();
  if (!s.trueEnd) return { tier: 0, conds: [] };
  const tier = clamp(META.tier | 0, 0, Math.min(3, s.tierMax || 1));
  return { tier, conds: META.conds.filter(k => CONDS[k]) };
}
const optOf = () => (G && G.opt) || { tier: 0, conds: [] };
const hasCond = k => optOf().conds.includes(k);
const tierK = () => TIERS[optOf().tier].k * Math.max(META_CAP.kMin, 1 - META_CAP.kPerCond * optOf().conds.length);   // 0.17 조건 수만큼 적 강화 완화
const slotW = () => hasCond('slot3') ? 3 : CFG.slots.weapon;
const selN = () => hasCond('two') ? 2 : CFG.select.cards;
const catOk = cat => hasCond('melee') ? cat === 'melee' : hasCond('ranged') ? cat !== 'melee' : true;
const startWeapon = () => hasCond('ranged') ? 'arrow' : START_WEAPON;
function optMul(o) { return TIERS[o.tier].mul * Math.min(META_CAP.condMul, o.conds.reduce((m, k) => m * CONDS[k].mul, 1)); }   // 0.17 조건 배율 누적 상한
function optText(o) { return [o.tier ? TIERS[o.tier].nm : null].concat(o.conds.map(k => CONDS[k].nm)).filter(Boolean).join(' · '); }
function playerColor() { const s = loadSaveCached(); const C = COLORS.find(x => x.id === s.color); return C && colorOpen(s, C) ? C.c : COLORS[0].c; }
const colorOpen = (s, C) => !C.need || (s.titles || []).includes(C.need);
let saveCache = null;                                       // 그리기용 저장 사본 (새 판·저장 변경 시 비움)
function loadSaveCached() { if (!saveCache) saveCache = loadSave(); return saveCache; }
function unlockTitle(s, id, R) { s.titles = s.titles || []; if (s.titles.includes(id)) return; s.titles.push(id); if (R) (R.newTitles = R.newTitles || []).push(TITLES[id]); }

/* 판 종료 저장 — 도감 기록·점수·칭호 (finishRun에서 호출) */
function metaSave(s) {
  const R = G.report, o = optOf(), add = (k, arr) => { s[k] = s[k] || []; for (const x of arr) if (x && !s[k].includes(x)) s[k].push(x); };
  add('seenW', G.p.weapons.map(w => w.id)); add('seenE', Object.keys(G.stats.kt)); add('seenJ', [G.p.job]); add('seenP', G.p.passives.map(x => x.id)); add('seenR', G.p.relics);
  const ok = G.ph.log.filter(x => x[2] === 'ok' && x[0] !== 'gate' && x[0] !== 'demon').length, dm = R.demon, dk = dm && dm[0] === 'kill', gk = R.gate && R.gate[1] === 'kill';
  const base = Math.round(G.kills * 0.2) + ok * 150 + (gk ? 2000 : 0) + (dk ? 6000 : 0), mul = optMul(o);   // 점수 초기식 (5단계 조정)
  R.score = Math.round(base * mul); R.mul = +mul.toFixed(2); R.opt = [o.tier, o.conds.join(',')];
  R.newBestScore = R.score > (s.bestScore || 0); s.bestScore = Math.max(s.bestScore || 0, R.score);
  if (dk && s.trueEnd) {                                     // 진엔딩 후 마왕 처치: 다음 단계 해금·칭호
    if (o.tier > 0) unlockTitle(s, 't' + o.tier, R);
    s.tierMax = Math.min(3, Math.max(s.tierMax || 1, o.tier + 1));
    for (const k of o.conds) unlockTitle(s, 'c_' + k, R);
  }
  saveCache = null;
}

  if (u.cd) a.push(`재사용 -${Math.round(u.cd * 100)}%`);
  if (u.pierce) a.push(id === 'boomerang' ? `타격 수 +${u.pierce}` : `관통 +${u.pierce}`);
  if (u.rot) a.push(`회전 속도 +${Math.round(u.rot * 100)}%`);
  return a.join(', ');
}

/* 현재 레벨 수치: 1레벨 기본값 + 2~L레벨 강화 누적 + 보조 효과 */
function wStats(w) {
  const D = WEAPONS[w.id], B = D.base, M = G.p.mod;
  const s = { dmg: 0, area: 0, cd: 0, n: 0, pierce: 0, rot: 0 };
  for (let i = 0; i < w.lvl - 1; i++) for (const k in D.ups[i]) s[k] += D.ups[i][k];
  // 분기 (0.5)
  let dm = 1, cm = 1;
  const br = w.br;
  if (br === 'wide') s.area += w.id === 'spin' ? 0.35 : 0.25;
  if (br === 'pierce') { s.pierce += 3; dm *= 1.15; }
  if (br === 'multi') s.n += 1;
  if (br === 'big') { s.area += 0.45; dm *= 1.2; cm *= 1.15; }
  if (pBr('might') === 'pen' && (w.id === 'arrow' || w.id === 'boomerang' || w.id === 'knife')) s.pierce += 1;
  if (br === 'fan') s.n += 2;
  if (br === 'swarm') { s.n += 2; dm *= 0.8; }
  // 3단계 보조 효과 (0.8): 공격 범위·투사체 수
  const aL = passLv('area'), mL = passLv('multi');
  if (aL) { if (pBr('area') === 'dense') dm *= 1 + 0.12 * aL; else s.area += 0.08 * aL + (pBr('area') === 'giant' ? 0.15 : 0); }
  if (pBr('area') === 'giant') dm *= 1.08;
  if (mL && B.n) { s.n += multiN(mL) + (pBr('multi') === 'barrage' ? 1 : 0); dm *= 1 + 0.03 * mL + (pBr('multi') === 'velocity' ? 0.2 : 0); if (pBr('multi') === 'barrage') cm *= 1.2; }   // 0.26 하향: 개수 2·5단계 각 +1, 단계당 피해 +3%
  // 직업 (0.6·0.7)
  if (G.p.job2 === 'archmage' && D.cat === 'magic') cm *= 0.8;
  if (G.p.job2 === 'berserk' && w.id === 'cleave' && G.p.fury >= 100) s.area += 0.3;
  if (jobCat(D.cat)) dm *= 1.1;                                          // 전직 계열 무기 피해 +10%
  if (G.p.job2 === 'accel') cm *= 0.88;
  return {
    dmg: B.dmg * (1 + s.dmg) * M.dmg * dm,
    area: 1 + s.area,
    cd: (B.cd || 0) * (1 - s.cd) * M.cd * cm,
    n: (B.n || 1) + s.n,
    pierce: (B.pierce || 0) + s.pierce,
    rot: (B.rot || 0) * (1 + s.rot) / M.cd,          // 재사용 감소는 회전검 회전 속도로 환산
  };
}

function aimAng(range = 520) { const t = nearestEnemy(G.p.x, G.p.y, range); return t ? Math.atan2(t.y - G.p.y, t.x - G.p.x) : Math.atan2(G.p.face.y, G.p.face.x); }
function enemiesInRange(x, y, r) { const a = []; gridQuery(x, y, r, e => { a.push(e); }); return a; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shoot(o) {
  const pr = Object.assign({ id: ++G.pid, t: 0, life: 1, r: 4, pierce: 0, hits: new Set(), color: '#fff', kind: 'bolt', src: '' }, o);
  pr.vx = Math.cos(o.ang) * o.sp; pr.vy = Math.sin(o.ang) * o.sp;
  if (SRC_CAT[pr.src] && wxOn(SRC_CAT[pr.src])) pr.jt = JOB_COL[G.p.job];   // 직업 변환 무기 발광 (0.26)
  if (G.proj.length < 400) G.proj.push(pr);
  return pr;
}
function explode(x, y, R, dmg, src, color = '#ff9a4a') {
  gridQuery(x, y, R, e => damageEnemy(e, dmg, { src, kb: 80, fx: x, fy: y }));
  fx({ kind: 'ring', x, y, r0: R * 0.3, r1: R, dur: 0.28, color, fill: true });
}

const WEAPON_FIRE = {
  /* 대검 베기: 가까운 적 방향 부채꼴 */
  cleave(w, S) {
    const D = WEAPONS.cleave.base, p = G.p, range = D.range * S.area, arc = D.arc * (w.br === 'wide' ? 1.45 : 1);
    const tg = nearestEnemy(p.x, p.y, range * 1.4);
    const a0 = tg ? Math.atan2(tg.y - p.y, tg.x - p.x) : Math.atan2(p.face.y, p.face.x);
    slash(a0, arc, range, S.dmg, D.kb);
    if (w.br === 'double') G.later.push({ t: 0.18, f: () => slash(a0 + Math.PI, arc, range, S.dmg * 0.7, D.kb) });
    if (hasRelic('bladestorm')) G.tm.storm = 1.5;
  },
  /* 화살: 가까운 적 방향 직선, 다발 시 좁은 부채꼴 */
  arrow(w, S) {
    const D = WEAPONS.arrow.base, a0 = aimAng();
    for (let i = 0; i < S.n; i++) shoot({ kind: 'arrow', x: G.p.x, y: G.p.y, ang: a0 + (i - (S.n - 1) / 2) * 0.12, sp: D.sp, r: 5, dmg: S.dmg, pierce: S.pierce, life: D.life, color: '#d8ffc8', src: 'arrow', split: w.br === 'split' });
  },
  /* 부메랑 도끼: 0.45초 후 되돌아오며 왕복 타격, 관통 무제한, 적별 왕·복 각 1회 */
  boomerang(w, S) {
    const D = WEAPONS.boomerang.base, a0 = aimAng(400);
    const spread = w.br === 'multi' ? 0.9 : 0.5;
    for (let i = 0; i < S.n; i++) shoot({ kind: 'boom', x: G.p.x, y: G.p.y, ang: a0 + (i - (S.n - 1) / 2) * spread, sp: D.sp, r: D.size * S.area, dmg: S.dmg, pierce: 999, cap: S.pierce, ho: 0, hr: 0, life: 3, color: '#f0c890', src: 'boomerang', spin: 0, burst: w.br === 'burst', flame: hasRelic('flameaxe') ? 0.25 : 0 });
  },
  /* 화염구: 착탄 또는 사거리 끝에서 폭발 */
  fireball(w, S) {
    const D = WEAPONS.fireball.base, a0 = aimAng(420), R = D.R * S.area;
    for (let i = 0; i < S.n; i++) shoot({ kind: 'fire', x: G.p.x, y: G.p.y, ang: a0 + (i - (S.n - 1) / 2) * 0.25, sp: D.sp, r: 8, dmg: S.dmg, R, life: 1.0, color: '#ff8a3a', src: 'fireball', pool: w.br === 'pool' });
  },
  /* 번개: 사거리 안 무작위 적 낙뢰, 대상 없으면 0.25초 후 재시도 */
  lightning(w, S) {
    let ts = shuffle(enemiesInRange(G.p.x, G.p.y, WEAPONS.lightning.base.range));
    if (!ts.length) return false;
    if (w.br === 'focus') ts.sort((a, b) => b.hp - a.hp);
    for (let i = 0; i < S.n && i < ts.length; i++) {
      const e = ts[i]; fx({ kind: 'bolt', x: e.x, y: e.y, dur: 0.18 });
      if (w.br === 'focus') { const x = e.x, y = e.y; gridQuery(x, y, 40, t => damageEnemy(t, S.dmg * 1.3, { src: 'lightning' })); fx({ kind: 'ring', x, y, r0: 6, r1: 40, dur: 0.2, color: '#bfe4ff' }); }
      else { damageEnemy(e, S.dmg, { src: 'lightning' }); if (w.br === 'chain') chainBolt(e, 2, S.dmg * 0.6, 'chain'); }
    }
  },
};

/* ---------- 3단계 추가 무기 (0.8) ---------- */
Object.assign(WEAPON_FIRE, {
  /* 방패 충격: 주변 적 강하게 밀쳐내기 · 방벽 분기: 1.5초간 받는 피해 -40% · 이중 충격 분기: 0.4초 뒤 넓은 2차 충격 */
  shield(w, S) {
    const D = WEAPONS.shield.base, p = G.p, R = D.R * S.area;
    shieldBash(p.x, p.y, R, S.dmg, D.kb);
    if (w.br === 'wall') G.tm.wall = 1.5;
    if (w.br === 'twin') G.later.push({ t: 0.4, f: () => shieldBash(G.p.x, G.p.y, R * 1.4, S.dmg * 0.9, D.kb * 0.6) });
    if (hasRelic('bulwark')) heal(p.maxHp * 0.01, '수호 방패');   // 0.35 3% → 1%
  },

  slam(w, S) {
    const D = WEAPONS.slam.base, p = G.p, R = D.R * S.area, x = p.x, y = p.y;
    slamWave(x, y, R, S.dmg, D.kb);
    if (w.br === 'after') G.later.push({ t: 1.0, f: () => slamWave(x, y, R * 0.9, S.dmg * 0.6, D.kb * 0.5) });
    if (w.br === 'fissure') for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; addPool({ x: x + Math.cos(a) * R * 0.6, y: y + Math.sin(a) * R * 0.6, r: 34, dur: 2, every: 0.4, dmg: S.dmg * 0.2, src: 'fissure', kind: 'crack' }); }
  },
  /* 투척 단검: 이동 방향 연사 · 부채 투척 분기: 단검 +2·넓은 부채꼴 · 출혈 분기: 명중 시 3초 지속 피해 */
  knife(w, S) {
    const D = WEAPONS.knife.base, p = G.p, a0 = Math.atan2(p.face.y, p.face.x), sp = w.br === 'fan' ? 0.22 : 0.09;
    for (let i = 0; i < S.n; i++) shoot({ kind: 'arrow', x: p.x, y: p.y, ang: a0 + (i - (S.n - 1) / 2) * sp, sp: D.sp, r: 4, dmg: S.dmg, pierce: S.pierce, life: D.life, color: '#e6e8f8', src: 'knife', bleed: w.br === 'bleed' });
  },
  /* 덫: 발밑 설치(최대 개수 제한), 밟으면 폭발 · 속박 분기: 폭발 범위 적 1.5초 정지 · 연쇄 분기: 폭발 시 작은 덫 2개 */
  trap(w, S) {
    const D = WEAPONS.trap.base, p = G.p, max = D.max + (S.n - 1) * 2;
    for (let i = 0; i < S.n; i++) {
      if (G.traps.length >= max) G.traps.shift();
      const a = rand(Math.PI * 2), d = i ? 18 : 0;
      G.traps.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d, r: 12, arm: 0.4, dmg: S.dmg, R: D.R * S.area, snare: w.br === 'snare', cluster: w.br === 'cluster' });
    }
  },
  /* 얼음 고리: 주변 냉기 (0.5초마다 둔화·피해) · 빙결 분기: 6% 확률 1초 빙결 · 파쇄 분기: 둔화된 적 처치 시 냉기 폭발 */
  icering(w, S) {
    const R = WEAPONS.icering.base.R * S.area, p = G.p, frz = w.br === 'freeze';
    gridQuery(p.x, p.y, R, e => { e.slowT = 0.7; if (frz && !e.cmd && !e.boss && Math.random() < 0.06) e.frz = 1; damageEnemy(e, S.dmg, { src: 'icering' }); });
    w.R = R;
  },
  /* 마력 구체: 추적 구체 · 군집 분기: 구체 +2·피해 -20% · 신성 폭발 분기: 명중 시 작은 폭발 */
  orb(w, S) {
    const D = WEAPONS.orb.base, p = G.p;
    for (let i = 0; i < S.n; i++) shoot({ kind: 'orb', x: p.x, y: p.y, ang: rand(Math.PI * 2), sp: D.sp, r: hasRelic('bigorb') ? 12 : 6, dmg: S.dmg, pierce: 0, life: D.life, color: '#9fb8ff', src: 'mbolt', home: true, nova: w.br === 'nova' });
  },
});
function shieldBash(x, y, R, dmg, kb) {
  gridQuery(x, y, R, e => damageEnemy(e, dmg, { src: 'shield', kb, fx: x, fy: y }));
  fx({ kind: 'ring', x, y, r0: R * 0.4, r1: R, dur: 0.22, color: '#c8d8ff', fill: true });
}
function slamWave(x, y, R, dmg, kb) {
  const frost = hasRelic('frostrift');
  gridQuery(x, y, R, e => { if (frost && !e.cmd && !e.boss) e.frz = 1.2; damageEnemy(e, dmg, { src: 'slam', kb, fx: x, fy: y }); });
  fx({ kind: 'ring', x, y, r0: 12, r1: R, dur: 0.35, color: frost ? '#bfe8ff' : '#d8b080' });
}
/* 덫 갱신 — 설치 후 0.4초 뒤 작동 */
function updateTraps(dt) {
  for (const t of G.traps) {
    t.arm -= dt; if (t.arm > 0) continue;
    let hit = false; gridQuery(t.x, t.y, t.r, () => { hit = true; return false; });
    if (!hit) continue;
    t.dead = true;
    explode(t.x, t.y, t.R, t.dmg, 'trap', '#e0c070');
    if (t.snare) gridQuery(t.x, t.y, t.R, e => { if (!e.cmd && !e.boss) e.frz = 1.5; });
    if (hasRelic('firetrap')) addPool({ x: t.x, y: t.y, r: t.R * 0.8, dur: 2, every: 0.4, dmg: t.dmg * 0.2, src: 'firetrap', kind: 'fire' });
    if (t.cluster && !t.mini) for (let i = 0; i < 2; i++) { const a = rand(Math.PI * 2); G.later.push({ t: 0.05, f: () => G.traps.push({ x: t.x + Math.cos(a) * 40, y: t.y + Math.sin(a) * 40, r: 10, arm: 0.5, dmg: t.dmg * 0.5, R: t.R * 0.7, mini: true }) }); }
  }
  G.traps = G.traps.filter(t => !t.dead);
}

function slash(a0, arc, range, dmg, kb) {
  const p = G.p;
  gridQuery(p.x, p.y, range, e => {
    let da = Math.atan2(e.y - p.y, e.x - p.x) - a0; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) <= arc / 2 + 0.15) damageEnemy(e, dmg, { kb, fx: p.x, fy: p.y, src: 'cleave' });
  });
  fx({ kind: 'arc', a: a0, arc, r: range, dur: 0.16, color: jobTint('melee') || '#ffe0d0' });
}
/* 회전검: 상시 회전, 적별 타격 간격 0.35초 · 투척 궤도 분기: 2.4초마다 0.8초간 반경 확장 (피해 130%) */
function updateSpin(w, S, dt) {
  const D = WEAPONS.spin.base, p = G.p, storm = G.tm.storm > 0 ? 2 : 1;
  let R = D.R * S.area, dm = S.dmg; const bsz = D.size * S.area;
  if (w.br === 'throw') { w.tt = ((w.tt || 0) + dt) % 2.4; if (w.tt < 0.8) { R *= 1 + 1.4 * Math.sin(Math.PI * w.tt / 0.8); dm *= 1.3; } }
  w.a = (w.a || 0) + S.rot * storm * dt; w.n = S.n; w.R = R; w.bs = bsz;
  for (let i = 0; i < S.n; i++) {
    const a = w.a + i * Math.PI * 2 / S.n, bx = p.x + Math.cos(a) * R, by = p.y + Math.sin(a) * R;
    gridQuery(bx, by, bsz, e => { if ((e.ht.spin || 0) <= G.time) { e.ht.spin = G.time + D.hitCd; damageEnemy(e, dm, { kb: D.kb, fx: p.x, fy: p.y, src: 'spin' }); } });
  }
}

function updateWeapons(dt) {
  for (const w of G.p.weapons) {
    const S = wStats(w);
    if (w.id === 'spin') { updateSpin(w, S, dt); continue; }
    w.t -= dt * ultCdMul();                                      // 군주 궁극기: 재사용 2배 속도
    if (w.t <= 0) {
      const r = WEAPON_FIRE[w.id](w, S); w.t = r === false ? 0.25 : S.cd; if (r !== false) rcFire(w);   // 공격 반응 (0.28)
     
      if (r !== false && pBr('haste') === 'echo' && Math.random() < 0.12) w.t = 0.05;   // 연속 발동 분기
    }
  }
  updateTraps(dt); updateArsenal(dt);                       // 0.27 철퇴·광선·폭탄·회오리
  // 지연 실행 (연속 베기 등)
  for (const L of G.later) { L.t -= dt; if (L.t <= 0) { L.done = true; L.f(); } }
  if (G.later.length) G.later = G.later.filter(L => !L.done);
}

/* 투사체 이동·충돌 */
function updateProjectiles(dt) {
  const p = G.p;
  for (const pr of G.proj) {
    if (pr.dead) continue;
    pr.t += dt; pr.life -= dt;
    if (pr.kind === 'boom') {
      pr.spin += dt * 14;
      if (pr.t > 0.45) {
        const dx = p.x - pr.x, dy = p.y - pr.y, d = Math.hypot(dx, dy) || 1;
        pr.vx += dx / d * 1100 * dt; pr.vy += dy / d * 1100 * dt;
        const sp = Math.hypot(pr.vx, pr.vy); if (sp > 520) { pr.vx *= 520 / sp; pr.vy *= 520 / sp; }
        if (d < 22 && pr.t > 0.6) { pr.dead = true; if (hasRelic('clockwork')) clockTick(); continue; }
      }
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      if (pr.burst && !pr.burstDone && pr.t > 0.45) { pr.burstDone = true; explode(pr.x, pr.y, 56, pr.dmg * 1.2, 'boomerang', '#f0c890'); }
      if (pr.flame) { pr.ft = (pr.ft || 0) - dt; if (pr.ft <= 0) { pr.ft = pr.flame; explode(pr.x, pr.y, 26, WEAPONS.fireball.base.dmg * 0.3 * G.p.mod.dmg, 'flame', '#ff9a4a'); } }
      const ret = pr.t > 0.45, key = 'b' + pr.id + (ret ? 'r' : 'o');   // 가는 길·돌아오는 길 적별 1회씩 타격 (0.2a)
      if ((ret ? pr.hr : pr.ho) < pr.cap)                                // 구간별 타격 수 상한 (0.2b)
        gridQuery(pr.x, pr.y, pr.r, e => { if (!e.ht[key]) { e.ht[key] = 1; damageEnemy(e, pr.dmg, { kb: 90, fx: pr.x, fy: pr.y, src: pr.src }); if (++pr[ret ? 'hr' : 'ho'] >= pr.cap) return false; } });
      if (pr.life <= 0) pr.dead = true;
      continue;
    }
    if (pr.home) {                                             // 추적 구체
      const t = nearestEnemy(pr.x, pr.y, 300);
      if (t) { const a = Math.atan2(t.y - pr.y, t.x - pr.x); pr.vx += Math.cos(a) * 900 * dt; pr.vy += Math.sin(a) * 900 * dt; const sp = Math.hypot(pr.vx, pr.vy); if (sp > 320) { pr.vx *= 320 / sp; pr.vy *= 320 / sp; } }
    }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    gridQuery(pr.x, pr.y, pr.r, e => {
      if (pr.dead || pr.hits.has(e.id)) return;
      pr.hits.add(e.id);
      if (pr.kind === 'fire' || pr.kind === 'shell') { fireBurst(pr); pr.dead = true; return false; }
      damageEnemy(e, pr.dmg, { kb: 40, fx: pr.x - pr.vx * 0.05, fy: pr.y - pr.vy * 0.05, src: pr.src });
      if (pr.bleed && !e.dead) { e.bl = 3; e.blD = pr.dmg * 0.25; }
      if (pr.nova) explode(pr.x, pr.y, 42, pr.dmg * 0.6, 'nova', '#b8c8ff');
      if (pr.split) { pr.split = false; const a = Math.atan2(pr.vy, pr.vx); for (const da of [-0.5, 0, 0.5]) { const s2 = shoot({ kind: 'arrow', x: pr.x, y: pr.y, ang: a + da, sp: 480, r: 4, dmg: pr.dmg * 0.5, pierce: 0, life: 0.5, color: '#d8ffc8', src: 'split' }); s2.hits.add(e.id); } }
      if (--pr.pierce < 0) { pr.dead = true; return false; }
      if (pr.bounce) { bounceProj(pr, e); return false; }   // 0.27 수리검 튕김
    });
    if (pr.life <= 0 && !pr.dead) { pr.dead = true; if (pr.kind === 'fire' || pr.kind === 'shell') fireBurst(pr); }
  }
  G.proj = G.proj.filter(x => !x.dead);
}

/* 화염구 착탄: 폭발 + 불길 분기·화염 장판 유물 장판 */
function fireBurst(pr) {
  if (pr.kind === 'shell') { explode(pr.x, pr.y, pr.R, pr.dmg, pr.src, '#ffd890'); return; }

/* 보물 상자 — 유물 후보 우선, 없으면 유물 재료 카드, 나머지는 강화 1회 */
function chestCands() {
  const p = G.p, out = [];
  for (const id of RELIC_ORDER) if (relicReady(id)) out.push({ t: 'relic', id });
  if (out.length < 3) for (const id of RELIC_ORDER) {
    const R = RELICS[id]; if (hasRelic(id)) continue;
    for (const [m, o] of [[R.a, R.b], [R.b, R.a]]) if (owns(o) && !owns(m) && !G.banished.has(m)) {
      if (WEAPONS[m] && p.weapons.length < slotW() && catOk(WEAPONS[m].cat) && !out.some(x => x.id === m)) out.push({ t: 'wnew', id: m, mat: id });
      if (PASSIVES[m] && p.passives.length < CFG.slots.passive && !out.some(x => x.id === m)) out.push({ t: 'pnew', id: m, mat: id });
    }
  }
  const ups = shuffle(levelCands().filter(c => c.t === 'wup' || c.t === 'pup'));
  while (out.length < 3 && ups.length) out.push(ups.shift());
  while (out.length < 3) out.push(FILL_CARDS[out.length % 2]);
  return out.slice(0, 3);
}

function scheduleElites() {
  const ph = G.ph, P = curPhase(), span = P.dur || P.fail || 120;
  if (P.goal === 'hunt' || P.goal === 'boss') { ph.elites = []; return; }   // 수문장전 제외 (0.11)                    // 엘리트 사냥은 전용 출현 일정 사용 (0.10)
  const n = Math.random() < ELITE.chance2 ? 2 : 1;
  ph.elites = [];
  for (let i = 0; i < n; i++) ph.elites.push(span * (0.18 + i * 0.4 + rand(0, 0.15)));
}
function spawnElite() {
  const types = ENEMY_ORDER.filter(k => ENEMIES[k].from <= G.time / 60 + 1.5 && k !== 'brute');
  const q = ringPos(20), e = makeEnemy(pick(types.length ? types : ['slime']), q.x, q.y);
  e.elite = pick(ELITE.ab); e.r *= ELITE.size; e.hp = e.maxHp = e.hp * ELITE.hp; e.xp = ELITE.xp; e.dmg *= 1.25;
  if (e.elite === 'haste') e.speed *= 1.7;

function catLevels() { const s = { melee: 0, ranged: 0, magic: 0 }; for (const w of G.p.weapons) s[WEAPONS[w.id].cat] += w.lvl; return s; }

/* 후보 3종: 주력 계열 2종(혼합 직업은 두 계열 모두 보유 시 주력 후보 포함) + 다른 계열 1종 (0.9 10직업 확장) */
function jobCands(prev = []) {
  if (typeof window !== 'undefined' && window.__vtJob && JOBS[window.__vtJob]) return [{ t: 'job', id: window.__vtJob }];   // 가상 시험 직업 지정 (dev/vtest.js --job)
  const mc = mainCat(), lv = catLevels();
  const fit = j => JOBS[j].cats ? JOBS[j].cats.includes(mc) && Math.min(...JOBS[j].cats.map(c => lv[c])) >= 0.4 * lv[mc] : JOBS[j].cat === mc;   // 혼합: 부 계열이 주력의 40% 이상
  let main = shuffle(JOB_ORDER.filter(fit)); const fresh = main.filter(j => !prev.includes(j));
  main = fresh.concat(main.filter(j => prev.includes(j))).slice(0, 2);
  const rest = shuffle(JOB_ORDER.filter(j => !main.includes(j) && (JOBS[j].cats ? !JOBS[j].cats.includes(mc) : JOBS[j].cat !== mc)));
  const other = rest.find(j => !prev.includes(j)) || rest[0];

}

function loadFieldArt(name, src) {
  const img = new Image();
  img.onload = () => {
    try {
      const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
      const c = cv.getContext('2d', {willReadFrequently: true}); c.drawImage(img, 0, 0);
      const data = c.getImageData(0, 0, cv.width, cv.height).data, half = Math.floor(cv.width / 2), frames = [];
      for (let f = 0; f < 2; f++) {
        let left = half, top = cv.height, right = -1, bottom = -1;
        for (let y = 0; y < cv.height; y++) for (let x = 0; x < half; x++) {
          if (data[(y * cv.width + f * half + x) * 4 + 3] > 12) {
            left = Math.min(left, x); right = Math.max(right, x); top = Math.min(top, y); bottom = Math.max(bottom, y);
          }
        }
        if (right < left) return;
        frames.push({x:f * half + left, y:top, w:right-left+1, h:bottom-top+1});
      }
      FIELD_ART.ready[name] = {img, frames, maxW:Math.max(...frames.map(f=>f.w)), maxH:Math.max(...frames.map(f=>f.h))};
      FIELD_ART.cache.clear(); SPR_CACHE.clear();
    } catch (err) { console.warn('Art fallback:', name, err.message); }
  };

function drawSpriteRot(c, name, frame, x, y, ang, opt) {
  const s = getSprite(name, frame, opt), k = 1 / (VIEW.zoom * VIEW.dpr), W = s.cv.width * k, H = s.cv.height * k;
  c.save(); c.translate(x, y); c.rotate(ang); c.drawImage(s.cv, -W / 2, -H / 2, W, H); c.restore();
}
function drawSpriteC(c, name, frame, x, y, opt) {
  const s = getSprite(name, frame, opt), k = 1 / (VIEW.zoom * VIEW.dpr), W = s.cv.width * k, H = s.cv.height * k;
  c.drawImage(s.cv, Math.round((x - W / 2) / k) * k, Math.round((y - H / 2) / k) * k, W, H);
}

/* 이동 보정: 기본 추적 속도(sp)를 받아 행동별로 바꾼 속도 반환 (game.js updateEnemies) */
function mobMove(e, dt, sp, d, dx, dy) {
  const k = e.mb;
  if (k === 'shoot') {
    const C = MOB.shoot; e.cd = (e.cd == null ? rand(C.cd[0], C.cd[1]) : e.cd) - dt;
    if (e.cd <= 0 && d < C.range && !G.result) { e.cd = rand(C.cd[0], C.cd[1]); gkShot(e.x, e.y, dx / d * C.sp, dy / d * C.sp, e.dmg * C.dmgK, ENEMIES.gob.name, '#c8ff7a'); }
    return d < C.keep[0] ? -sp * 0.8 : d < C.keep[1] ? 0 : sp;
  }
  if (k === 'bomb') {
    const C = MOB.bomb;
    if (e.fuse != null) { e.fuse -= dt; e.flash = Math.floor(e.fuse * 12) & 1 ? 0.05 : 0; if (e.fuse <= 0) mobBlast(e); return 0; }
    if (d < C.near && !G.result) { e.fuse = C.fuse; gkCircle(e.x, e.y, C.R, C.fuse, e.dmg * C.dmgK, ENEMIES.mush.name); return 0; }
    return sp;
  }
  if (k === 'dash') {
    const C = MOB.dash; e.cd = (e.cd == null ? rand(C.cd[0], C.cd[1]) : e.cd) - dt;
    if (e.dsh > 0) { e.dsh -= dt; e.x += e.ddx * e.speed * C.spK * dt; e.y += e.ddy * e.speed * C.spK * dt; return 0; }
    if (e.tl > 0) { e.tl -= dt; if (e.tl <= 0) e.dsh = C.dur; return 0; }
    if (e.cd <= 0 && d < C.near && !G.result && sp > 0) {
      e.cd = rand(C.cd[0], C.cd[1]); e.tl = C.tele; e.ddx = dx / d; e.ddy = dy / d;
      G.hz.push({ k: 'line', x: e.x, y: e.y, dx: e.ddx, dy: e.ddy, len: e.speed * C.spK * C.dur, w: e.r * 2, warn: C.tele, t: 0, dmg: 0, follow: e });
      return 0;
    }
    return sp;
  }
  if (k === 'weave') { const C = MOB.weave, s = Math.cos(G.time * C.freq + e.id) * sp * C.amp; e.x += -dy / d * s * dt; e.y += dx / d * s * dt; return sp; }
  return sp;
}
function mobBlast(e) { e.dead = true; burst(e.x, e.y, 8, '#ff9a4a', 160, 0.5, 3); }
function mobDmgMul(e, o) { return e.mb === 'shield' && !o.crit && o.src !== 'bleed' ? MOB.shield.mul : 1; }
function mobKilled(e) {
  if (e.mb !== 'split') return;
  const C = MOB.split;
  for (let i = 0; i < C.n; i++) { const a = rand(Math.PI * 2), c = makeEnemy('slime', e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10); c.hp = c.maxHp = e.maxHp * C.hpK; c.xp = 1; c.kbx = Math.cos(a) * 90; c.kby = Math.sin(a) * 90; }
}

/* 상단 아래 아이콘 줄: 무기 5칸 · 보조 효과 5칸 */

      c.font = 'bold 9px Galmuri11, system-ui'; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; c.lineWidth = 2.5; c.strokeStyle = 'rgba(0,0,0,0.8)';

  p.weapons.forEach((w, i) => { const jt = jobTint(WEAPONS[w.id].cat); if (!jt) return; const x = 12 + i * (S + gap); c.strokeStyle = jt; c.lineWidth = 2.5; c.strokeRect(x + 1.25, y + 1.25, S - 2.5, S - 2.5); c.fillStyle = jt; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 8, y); c.lineTo(x, y + 8); c.closePath(); c.fill(); });   // 직업 변환 무기 표시 (0.26)
  row(p.passives, CFG.slots.passive, px0, () => CFG.colors.passive, ps => PASSIVES[ps.id].ic);
  // 0.25 주기형 효과 재사용 표시: 시계 방향으로 채워지는 원형 (숫자 없음)
  const T = G.tm, pie = (x, y, r, k) => { c.fillStyle = 'rgba(10,8,16,0.55)'; c.beginPath(); c.moveTo(x, y); c.arc(x, y, r, -Math.PI / 2 + Math.PI * 2 * clamp(k, 0, 1), Math.PI * 1.5); c.closePath(); c.fill(); c.strokeStyle = k >= 1 ? '#fff6c8' : 'rgba(255,255,255,0.75)'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(k, 0, 1)); c.stroke(); };

    if (!st) continue;

/* 진행 상태 바로가기 (0.15a) — 시험 도구 --preset 동일 내용 주입, 최초 적용 시 실제 저장 데이터 백업 */

function devRestore() {

    const put = (k, v) => v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
    put(CFG.SAVE_KEY, b.main); put(CFG.SAVE_KEY + '_run', b.run); localStorage.removeItem(DEV_BAK());
  } catch (e) { }

/* 자동 이동 — 시험용 (켜면 레벨업 카드도 자동 선택) (초안 자동 로직 v2 축약: 16방향 위험도 + 경험치 무리 추적 + 적 무리 접근) */
const AUTO = { dir: { x: 0, y: -1 }, next: 0, out: null, run: null };
const AUTO_DIRS = Array.from({ length: 16 }, (_, i) => ({ x: Math.cos(i * Math.PI / 8), y: Math.sin(i * Math.PI / 8) }));
function autoDanger(qx, qy) {
  const p = G.p; let d = 0;
  for (const k of G.ph.cracks) if (!k.done) { const dd = Math.sqrt(dist2(k.x, k.y, qx, qy)) - k.r - p.r; if (dd < 10) d += 30 + 30 * k.t / PH_CFG.crackWarn; }   // 붕괴 예고 회피 (0.10)
  const A = G.arena; if (A) { const o = Math.sqrt(dist2(A.x, A.y, qx, qy)) - (A.R - p.r - 25); if (o > 0) d += 40 + o; }   // 마왕 결계 밖 회피 (0.12)
  if (G.hz) for (const h of G.hz) {                                                       // 수문장 예고 구역·장판 회피 (0.11)
    if (h.k === 'sect') { if (!h.fired && dmInSect(h, qx, qy, p.r + 12)) d += 30 + 30 * h.t / h.warn; continue; }   // 마왕 낫·광선 (0.12)
    if (h.k === 'beam') { if (h.t > h.warn - 0.5 && dmOnBeam(h, qx, qy, p.r + 14)) d += 45; continue; }
    if (h.k === 'mir') { if (h.t > h.warn - 0.5 && bpOnMirror(h, qx, qy, p.r + 14)) d += 45; continue; }   // 0.33 거울진
    if (h.k === 'circ') { if (h.fired && !h.pool) continue; const dd = Math.sqrt(dist2(h.x, h.y, qx, qy)) - h.r - p.r * 0.5; if (dd < 12) d += h.fired ? 25 : 30 + 30 * h.t / h.warn; }
    else if (h.t <= h.warn + 0.6) { const rx = qx - h.x, ry = qy - h.y, al = rx * h.dx + ry * h.dy; if (al > -20 && al < h.len + 20 && Math.abs(rx * h.dy - ry * h.dx) < h.w / 2 + p.r + 10) d += 45; }
  }
  if (G.rocks) for (const r of G.rocks) if (dist2(r.x, r.y, qx, qy) < (r.r + p.r + 6) ** 2) d += 20;   // 0.33 바위 장애물
  if (G.eb) for (const b of G.eb) {                                                       // 적 탄환 진행 경로 회피 (0.11)
    const rx = qx - b.x, ry = qy - b.y; if (Math.abs(rx) > 120 || Math.abs(ry) > 120) continue;
    const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, al = rx * ux + ry * uy; if (al < -10 || al > 130) continue;

  return d;
}
function autoTarget() {
  const p = G.p, ph = G.ph; let best = null, bs = 0;
  if (ph.zone && p.hp > p.maxHp * 0.6) return { x: ph.zone.x, y: ph.zone.y, k: 'goal' };              // 봉인석 구역 우선 (0.3)
  for (const c of G.chests) if (dist2(c.x, c.y, p.x, p.y) < 500 * 500) return { x: c.x, y: c.y, k: 'goal' };   // 보물 상자 (0.5)
  if (ph.camp && !ph.camp.used) return { x: ph.camp.x, y: ph.camp.y, k: 'goal' };                                 // 야영지 (0.10)
  if (ph.cart && !ph.cart.done && dist2(ph.cart.x, ph.cart.y, p.x, p.y) > 90 * 90) {                                       // 수레 곁 유지
    const c = ph.cart, dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy) || 1; return { x: c.x + dx / d * 40, y: c.y + dy / d * 40, k: 'goal' }; }
  if (G.cr && G.cr.type === 'thief' && !G.cr.mob.dead && p.hp > p.maxHp * 0.4) return { x: G.cr.mob.x, y: G.cr.mob.y, k: 'boss' };   // 보물 몹 추격 (0.24)

  if (ev && ev.type === 'giant' && ev.state === 'active' && p.hp > p.maxHp * 0.4) return { x: ev.mob.x, y: ev.mob.y, k: 'boss' };
  if (ph.rits && p.hp > p.maxHp * 0.35) { const r = ph.rits.filter(e => !e.dead).sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y))[0]; if (r) return { x: r.x, y: r.y, k: 'boss' }; }   // 마법진 파괴
  if (G.altar && p.hp > p.maxHp * 0.4 && !aiProfile().skipAltar) return { x: G.altar.x, y: G.altar.y, k: 'goal' };     // 전직 제단 (0.6)
  if (ph.spring && !ph.spring.used && p.hp < p.maxHp * 0.85) return { x: ph.spring.x, y: ph.spring.y, k: 'goal' };
  const gb = G.gkMob; if (gb && !gb.dead && isBossPhase() && p.hp > p.maxHp * 0.3) { const t = autoGkTarget(gb); return { x: t.x, y: t.y, k: 'gk' }; }   // 수문장 교전 (0.11)
  if (ph.cmd && !ph.cmd.dead && p.hp > p.maxHp * 0.4) return { x: ph.cmd.x, y: ph.cmd.y, k: 'boss' };            // 대장 교전 유도
  for (const g of G.gems) {
    if (g.mag) continue; const d = Math.sqrt(dist2(g.x, g.y, p.x, p.y)); if (d > 420) continue;
    let crowd = 0; gridQuery(g.x, g.y, 40, () => { crowd++; if (crowd > 6) return false; });
    const s = (g.v * 18 * (p.hp < p.maxHp * 0.5 ? 0.5 : 1)) / (d + 50) / (1 + crowd * 0.5);

  return null;
}
/* 세렌 본체 탐색: 분열 후 1.2~2.6초 반응 지연, 80% 확률로 본체 식별 (미식별 시 가까운 분신 공격) */
function autoGkTarget(e) {
  if (e.gk !== 'seren') return e;
  const s = e.ai.splitAt || 0, p = G.p;
  if (AUTO.split !== s) { AUTO.split = s; AUTO.seeAt = s + rand(1.2, 2.6); AUTO.see = Math.random() < 0.8; }
  if (G.time >= AUTO.seeAt && AUTO.see) return e;
  return [e].concat(G.enemies.filter(o => o.clone && !o.dead)).sort((a, b) => dist2(a.x, a.y, p.x, p.y) - dist2(b.x, b.y, p.x, p.y))[0];
}
function autoVec() {

  let tx = 0, ty = 0, td = 0, pull = 1;
  if (tg) { tx = tg.x - p.x; ty = tg.y - p.y; td = Math.hypot(tx, ty) || 1; tx /= td; ty /= td; }
  if (tg && tg.k === 'fight') pull = td > 130 ? 1 : td > 90 ? 0.2 : -0.4;
  if (tg && tg.k === 'boss') pull = td > 60 ? 1 : 0;                       // 대장은 근접 사거리까지 접근

  if (tg && tg.k === 'goal' && td < stopR) return (AUTO.out = { x: 0, y: 0, m: 0 });
  if (here < 1.5 && -here >= bs && !(tg && (tg.k === 'gem' || tg.k === 'goal'))) return (AUTO.out = { x: 0, y: 0, m: 0 });

  let x = AUTO.dir.x * (1 - k) + best.x * k, y = AUTO.dir.y * (1 - k) + best.y * k; const m = Math.hypot(x, y) || 1;

}

/* 대사창 틀 — 화면 하단 고정, 초상화 자리·이름·본문, 누르면 다음 줄 (대사 내용은 4단계)

const DLG = { lines: null, i: 0, shown: 0, timer: null, done: null, prev: 'play' };
function showDialog(lines, done) {

  document.getElementById('dnm').textContent = L.name || '';

function dlgFull() {
  clearInterval(DLG.timer); DLG.timer = null; DLG.shown = DLG.lines[DLG.i].text.length; dlgPaint(); const n = document.getElementById('dnx'); if (n) n.style.visibility = 'visible';
  if (SETTINGS.dlgAuto || STATE.dev.auto) { const L = DLG.lines, i = DLG.i; setTimeout(() => { if (DLG.lines === L && DLG.i === i && !DLG.timer) dlgTap(); }, STATE.dev.auto ? 400 : 1800); }   // 대사 자동 넘김 (0.14)

/* 일시정지 버튼 — 진행 중에만 표시 */
const PBTN = document.createElement('button');
PBTN.id = 'pausebtn'; PBTN.className = 'pausebtn'; PBTN.setAttribute('aria-label', '일시정지'); PBTN.textContent = 'Ⅱ';

/* 화면 전환·앱 이탈 시 자동 일시정지 */

/* ============================================================
   주 반복
   ============================================================ */
let lastT = performance.now();
/* 성능 측정 (0.18, 5단계 결정 안건 3) — 판 진행 중 실제 프레임 간격 누적: 1ms 단위 분포로 평균·하위 1%·하위 5% FPS 산출 */
const PERF = { bins: new Uint32Array(101), n: 0, sum: 0 };

}

  if (raw > 0) STATE.fps = STATE.fps * 0.92 + (1 / raw) * 0.08;
  if (raw > 0 && STATE.mode === 'play' && !document.hidden) perfAdd(raw);
  try {

      const sp = STATE.dev.speed, n = Math.ceil(sp), rs = rcScale(raw);   // 정지·슬로모션 (0.28)
      for (let i = 0; i < n; i++) { step(raw * sp / n * rs); if (STATE.mode !== 'play') break; }
    }
    if (G) render();

    auWatch();
    syncPauseBtn();
    if (DEV.open && Math.floor(now / 500) !== Math.floor((now - raw * 1000) / 500)) DEV.info();
  } catch (err) {
    console.error(err);
    if (!window.__errShown) { window.__errShown = true; const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;background:#400;color:#fff;font:12px monospace;padding:8px;z-index:99;white-space:pre-wrap'; d.textContent = '오류: ' + (err && err.stack || err); document.body.appendChild(d); }
