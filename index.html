<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>템트리 노트</title>
<meta name="description" content="롤 챔피언별 아이템·룬·소환사 주문·선마 빌드 기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEFF2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1016">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<script>/* 화면 테마·움직임 설정을 첫 화면 전에 적용 */try{var u=JSON.parse(localStorage.getItem('ttn.v1.ui')||'{}');if(u.theme==='dark'||u.theme==='light'){document.documentElement.dataset.theme=u.theme;var c=u.theme==='dark'?'#0A1016':'#ECEFF2';document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=c;});}if(u.motion==='off')document.documentElement.classList.add('rm');var vm=document.querySelector('meta[name="viewport"]');if(u.scale&&u.scale!==100&&vm&&document.querySelector('link[rel="manifest"]')&&matchMedia('(pointer: coarse)').matches){var L=matchMedia('(orientation: landscape)').matches,dw=L?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);vm.content='width='+Math.round(dw*100/u.scale)+',viewport-fit=cover';}}catch(e){}</script>
<title>템트리 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 빌드 한 장 = 초상화·주문·선마 / 아이템 / 룬 전체 트리. 열람과 편집이 같은 화면, 편집 버튼은 엄지 영역(우하단) 고정 */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F2F4F6; --raise:#FFFFFF; --line:#D3D9DF; --line-strong:#B9C2CA;
  --fg:#121A21; --muted:#56626D; --gold:#87651F; --gold-soft:#F3EAD6; --on-gold:#FFFFFF;
  --warn:#A44E14; --warn-soft:#FBE9D9; --danger:#B3261E; --ok:#2B7A52; --toast-act:#E6C47A;
  --fg-2:#2A323A; --c-ap:#5B4BD3;
  --c-mag:#0A78BE; --c-phy:#B35A0A; --c-heal:#2A7A3B; --c-shield:#4F6478; --c-cc:#9238A0; --c-spd:#147570; --c-mana:#1E6CB5; --c-ar:#876707; --c-mr:#6B3EBF;
  --shadow:0 18px 40px rgba(14,22,30,.18); --dim:.16; --edge:rgba(14,22,30,.16); --on-danger:#FFFFFF;
  --f-body:Roboto,"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:var(--f-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1016; --surface:#111920; --surface-2:#18222B; --raise:#24313C; --line:#24303A; --line-strong:#34434F;
    --fg:#E8E4D9; --muted:#8E9AA5; --gold:#CDAA5F; --gold-soft:#2A2315; --on-gold:#15110A;
    --warn:#E59A62; --warn-soft:#33210F; --danger:#F08A80; --ok:#6CC69A; --toast-act:#7A5A16;
    --fg-2:#D3D7DC; --c-ap:#8C7CF5;
    --c-mag:#2BA9EC; --c-phy:#F28C2E; --c-heal:#45B866; --c-shield:#B7C6D6; --c-cc:#DA8FE3; --c-spd:#79D5CE; --c-mana:#62B5FF; --c-ar:#E5C25B; --c-mr:#B48FFF;
    --shadow:0 18px 40px rgba(0,0,0,.5); --dim:.42; --edge:rgba(0,0,0,.55); --on-danger:#2B0B08; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1016; --surface:#111920; --surface-2:#18222B; --raise:#24313C; --line:#24303A; --line-strong:#34434F;
  --fg:#E8E4D9; --muted:#8E9AA5; --gold:#CDAA5F; --gold-soft:#2A2315; --on-gold:#15110A;
  --warn:#E59A62; --warn-soft:#33210F; --danger:#F08A80; --ok:#6CC69A; --toast-act:#7A5A16;
  --fg-2:#D3D7DC; --c-ap:#8C7CF5;
  --c-mag:#2BA9EC; --c-phy:#F28C2E; --c-heal:#45B866; --c-shield:#B7C6D6; --c-cc:#DA8FE3; --c-spd:#79D5CE; --c-mana:#62B5FF; --c-ar:#E5C25B; --c-mr:#B48FFF;
  --shadow:0 18px 40px rgba(0,0,0,.5); --dim:.42; --edge:rgba(0,0,0,.55); --on-danger:#2B0B08; color-scheme:dark;
}
*{box-sizing:border-box}
/* 화면 = 페이지를 겹겹이 쌓은 구조. 각 페이지가 자기 스크롤을 가져 뒤로 가도 이전 페이지가 그대로 남아 있음 */
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.top,.pg-t,.pg-f,.chips,.seg,.tray,.bcard,.ctile{-webkit-user-select:none;user-select:none}
button:disabled{cursor:default;opacity:.35}
input,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
h1,h2,h3{margin:0;text-wrap:balance}

/* 페이지: 위로 쌓일 때 오른쪽에서 들어오고, 바로 아래 페이지는 왼쪽으로 조금 밀려 어두워짐 (밀어서 뒤로 갈 때 그대로 드러남) */
#stack{position:fixed;inset:0;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);contain:layout size style;will-change:transform;touch-action:pan-y pinch-zoom}
.page+.page{box-shadow:-14px 0 30px var(--edge)}
.page.under{transform:translateX(-28%)}
.page.deep{visibility:hidden}
.page.leaving{pointer-events:none}
.pg-dim{position:absolute;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none}
.page.under>.pg-dim{opacity:var(--dim)}
.nopress,.nopress:active{transform:none!important}
.pg-b{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y pinch-zoom}   /* 스크롤 영역마다 지정해야 가로 밀기를 브라우저가 가져가지 않음 */
.vb{padding-block:14px 48px}
.page.has-fab .vb{padding-bottom:104px}
.sb{display:flex;flex-direction:column;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px),calc((100% - 720px)/2)) 28px max(16px,env(safe-area-inset-left,0px),calc((100% - 720px)/2))}
.sb>*{flex-shrink:0}
.pg-t{flex:none;padding:10px max(16px,env(safe-area-inset-right,0px),calc((100% - 720px)/2)) 10px max(16px,env(safe-area-inset-left,0px),calc((100% - 720px)/2));border-bottom:1px solid var(--line)}
.pg-f{flex:none;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px),calc((100% - 720px)/2)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px),calc((100% - 720px)/2))}
.pg-f>.btn.block{flex:1}
.boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
/* 상단 바 */
.top{flex:none;position:relative;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:6px;min-height:54px}
.top-title{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;letter-spacing:-.01em}
.brand svg{width:18px;height:18px;flex:none}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.sm svg{width:18px;height:18px}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;min-width:32px;min-height:40px;font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px;border-radius:10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--gold)}
.sync[data-s="local"] i,.sync[data-s="error"] i,.sync[data-s="offline"] i{background:var(--warn)}
.sync .lbl{display:inline-block;min-width:8.5em}
@media(max-width:430px){.sync .lbl{display:none}}

.stack{display:flex;flex-direction:column;gap:14px}

/* 공통 */
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.home-head .chips{margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chip{flex:none;text-align:center;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background-color .12s,color .12s,border-color .12s}
.chip.sm{height:28px;padding:0 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;white-space:nowrap;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg.sm button{height:30px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{position:relative;display:block}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:12px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px}
.btn-row>.btn{flex:1}
.linkbtn{font-size:12.5px;font-weight:600;color:var(--gold);padding:4px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;min-width:0;transition:border-color .15s}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:24px}
.card-h h2{font-size:14px;font-weight:700;letter-spacing:.01em;flex:1}
.empty{border:1px dashed var(--line-strong);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--fg);font-size:16px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:9px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.banner span{flex:1;min-width:180px}
.banner.info{background:var(--gold-soft);color:var(--fg)}
.none{font-size:13px;color:var(--muted)}
.v{font-variant-numeric:tabular-nums}
.desc .v,.rcap .v{color:var(--fg-2)}
.v.q{color:var(--muted);font-weight:500;border-bottom:1px dotted var(--muted)}
.gold{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;color:var(--gold);white-space:nowrap}
.gold::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--gold);vertical-align:0}
/* 효과 색상: 베이스 앱 규칙 (설명문은 굵게 쓰지 않고 색으로만 구분. 마법 피해 하늘색, 주문력 계수 보라, 물리·공격력 주황, 체력 초록) */
.kn{color:var(--gold);font-weight:500}
.kb{color:var(--fg)}
.km{color:var(--c-mag)}
.kap{color:var(--c-ap)}
.kp{color:var(--c-phy)}
.kt{color:var(--fg)}
.kh{color:var(--c-heal)}
.ks{color:var(--c-shield)}
.kc{color:inherit}
.ksp{color:var(--c-spd)}
.kmn{color:var(--c-mana)}
.ka{color:var(--c-ar)}
.kr{color:var(--c-mr)}
.kg{color:var(--gold);font-weight:600}
.ki{color:var(--muted);font-style:italic}
.kl{color:var(--muted)}
.kd{color:var(--danger)}
.skd .desc .kn,.skd .desc .kb{color:var(--fg);font-weight:400}

/* 스프라이트 아이콘 */
.ico{display:inline-block;flex:none;width:var(--px);height:var(--px);border-radius:6px;background-repeat:no-repeat;background-color:var(--surface-2)}
.ico-missing{display:inline-grid;place-items:center;color:var(--muted);font-weight:700}
.ico.clear{background-color:transparent}

/* 홈 */
.home-head{display:flex;flex-direction:column;gap:12px}
.champ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 8px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;padding:4px 0;border-radius:10px}
.ctile:hover{background:var(--surface)}
.ctile .ico{border-radius:12px;border:1px solid var(--line)}
.ctile span.n{font-size:12.5px;font-weight:500;text-align:center;line-height:1.25;word-break:keep-all}
.ctile .has{position:absolute;top:5px;right:calc(50% - 32px);width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.ctile .fav{position:absolute;top:2px;left:calc(50% - 34px);color:var(--gold);font-size:13px;line-height:1}
.blist{display:grid;gap:10px}
@media(min-width:760px){.blist{grid-template-columns:1fr 1fr}}
/* 빌드 카드: 왼쪽 초상화+챔피언 이름 / 오른쪽 위 핵심 룬+제목, 아래 아이템 (아이템 줄 아래선 = 챔피언 이름 아래선) */
.bcard{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;width:100%;transition:border-color .12s}
.bcard:hover{border-color:var(--line-strong)}
.bcard:active{border-color:var(--gold)}
.bc-por{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bc-por .ico{border-radius:12px;border:1px solid var(--line)}
.bc-cn{font-size:12.5px;font-weight:500;color:var(--muted);max-width:64px;text-align:center;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.bc-top{display:flex;align-items:center;gap:7px;min-height:24px}
.ks-ph{flex:none;width:22px;height:22px;margin:1px;border-radius:50%;border:1.5px dashed var(--line-strong)}
.bcard-title{flex:1;min-width:0;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{color:var(--gold);margin-right:4px}
.bc-items{display:grid;grid-template-columns:repeat(var(--n),minmax(0,40px));gap:4px}
.bi{aspect-ratio:1;line-height:0;min-width:0}
.bi.more{display:grid;place-items:center;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;line-height:1}
.bi .ico{width:100%!important;height:100%!important;border-radius:6px;background-size:var(--bs) auto!important}

/* 챔피언 화면 */
.chero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chero-por{line-height:0;border-radius:17px;flex:none}
.chero .ico{border-radius:16px;border:1px solid var(--line)}
.chero-por:hover .ico{border-color:var(--gold)}
.chero h1{font-size:24px;line-height:1.2}
.chero .t{color:var(--muted);font-size:14px}
.favbtn[aria-pressed="true"]{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.sklist{display:flex;flex-direction:column}
.skrow{display:flex;gap:12px;align-items:center;padding:8px 0;text-align:left;width:100%}
.skrow+.skrow{border-top:1px solid var(--line)}
.skrow .ico{border-radius:8px}
.skrow .m{flex:1;min-width:0}
.skrow .nm{font-weight:600;font-size:14.5px;display:block}
.skrow .key{font:700 12px var(--f-disp);color:var(--gold);margin-right:6px}
.chev{color:var(--muted);font-size:18px;flex:none}

/* 빌드 화면: 초상화(누르면 챔피언 정보) · 제목 · 주문 2개 + 선마 */
.bh{position:relative;display:flex;gap:14px;align-items:center}
.ph{visibility:hidden}
.bh-por{flex:none;line-height:0;border-radius:15px;transition:transform .12s}
.bh-por .ico{border-radius:14px;border:1px solid var(--line);transition:border-color .12s}
.bh-por:hover .ico{border-color:var(--gold)}
.bh-por:active{transform:scale(.96)}
.bh-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
/* 제목: 열람(글자)과 편집(입력칸)이 같은 높이·같은 글자 위치 */
.ttl{display:block;width:100%;height:40px;margin:0;padding:0;border:0;font:700 18px/40px var(--f-body);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.ttl{width:calc(100% + 11px);margin-left:-11px;padding:0 10px;border:1px solid var(--gold);border-radius:9px;background:var(--surface);line-height:38px}
.spl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{line-height:0;border-radius:9px}
.sp .ico{border-radius:8px;border:1px solid var(--line)}
.sp[aria-expanded="true"] .ico,.mx[aria-expanded="true"]{box-shadow:0 0 0 2px var(--gold)}
.edit .sp .ico{border-style:dashed;border-color:var(--gold)}
.mx{height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mx b{font:700 16px/1 var(--f-disp);color:var(--gold)}
.mx.on{color:var(--fg);background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.edit .mx{border-style:dashed;border-color:var(--gold)}
/* 주문·선마 팝업: 아래 내용을 밀지 않고 위에 겹쳐 뜸 */
.pop-bg{position:fixed;inset:0;z-index:35}
.pop{position:absolute;z-index:36;left:0;top:0;background:var(--raise);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);animation:popin .12s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
#bv{position:relative;display:block}
#bv:not(.edit) .ib.add.opt{display:none}
.edit .v-only,#bv:not(.edit) .e-only{display:none}
#bv>.card,#bv>.bh{contain:layout}
#bv>*+*{margin-top:14px}
#pop-layer{position:absolute;left:0;top:0;width:100%;height:0;margin:0}
.pop{contain:layout}
.pop-sp{width:min(304px,100%);padding:10px}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.seg.xs{padding:2px;border-radius:9px}
.seg.xs button{height:28px;padding:0 12px;font-size:12.5px;border-radius:7px}
.pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.spopt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border-radius:9px;text-align:center;line-height:1.2;min-width:0}
.spopt .ico{border-radius:7px}
.spopt .nm{font-size:11.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spopt small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.spopt.na{opacity:.45}
.spopt[aria-selected="true"]{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.pop-mx{width:224px;padding:4px}
.mxo{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 8px 4px 5px;border-radius:10px;width:100%}
.mxo .nm{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mxo .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:11px;font-weight:700}
.mxo[aria-selected="true"]{background:var(--gold-soft)}
.mxo[aria-selected="true"] .ck{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.mxo:active{background:var(--surface-2)}
.mxo .kbox{min-width:16px;height:16px;font-size:10.5px}

/* 아이템 */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.ib{position:relative;line-height:0;border-radius:9px;aspect-ratio:1;max-width:100%;-webkit-user-select:none;user-select:none}
.ib .ico{width:100%!important;height:100%!important;border-radius:9px;border:1px solid var(--line);background-size:var(--bs) auto!important}
.ib.legend .ico{border-color:color-mix(in srgb,var(--gold) 70%,transparent)}
.ib.miss .ico{border-style:dashed;border-color:var(--warn)}
.ib.add{display:grid;place-items:center;border:1.5px dashed var(--line-strong);color:var(--muted);font-size:22px;line-height:1}
.ib:active{transform:scale(.94)}
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.edit .ib[data-drag],.tb[data-drag]{touch-action:none;cursor:grab}
[data-drag].ph{visibility:visible;opacity:.22}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;margin:0;border-radius:9px;box-shadow:0 12px 26px rgba(0,0,0,.38);opacity:.96}

/* 룬 전체 트리: 칸 너비에 맞춰 아이콘이 커짐 */
.runes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{background:var(--surface-2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rt-sty,.rt-row{display:flex;justify-content:space-around;align-items:center;gap:4px}
.rt-sty{padding-bottom:8px;border-bottom:1px solid var(--line)}
.rt-sh{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 4px;justify-items:center;padding-top:9px;border-top:1px solid var(--line)}
.ro{flex:0 1 var(--mx);min-width:0;aspect-ratio:1;line-height:0;border-radius:50%}
.rt-sty .ro{--mx:30px}
.rt-row .ro{--mx:44px}
.rt-row.k .ro{--mx:56px}
.rt-sh .ro{width:30px;max-width:100%}
.ro .ico{display:block;width:100%!important;height:100%!important;background-size:var(--bs) auto!important;filter:grayscale(1);opacity:.32}
.edit .ro .ico{opacity:.55}
.ro.on{box-shadow:0 0 0 2px var(--gold)}
.ro.on .ico{filter:none;opacity:1}
.ro.key.on{box-shadow:0 0 0 2px var(--gold),0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}
.rcap{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;line-height:1.6}
.rcap .rn{display:block;font-weight:500;color:var(--gold);margin-bottom:2px}
.rcap{color:var(--fg-2)}

/* 편집 버튼 (엄지 영역) */
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;height:50px;min-width:136px;justify-content:center;padding:0 18px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--gold);color:var(--on-gold)}

/* 빌드 메뉴: 아래에서 올라오는 작은 메뉴 (페이지가 아닌 선택지 목록) */
.sheet-root{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(5,9,13,.5);touch-action:none}
.sheet-h,.sheet-t,.sheet-f,.sheet-grip{touch-action:none}
.sheet-root.closing{pointer-events:none}
.sheet-grip{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-strong);z-index:1}
@media(min-width:720px){.sheet-grip{display:none}}
/* 누름·선택 반응 */
@keyframes bump{0%{transform:scale(.86)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.bump{animation:bump .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pinIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.tb.pin-in{animation:pinIn .22s cubic-bezier(.2,.8,.2,1)}
.pit .chk{animation:bump .24s cubic-bezier(.2,.8,.2,1)}
.btn,.chip,.mx,.sp,.spopt,.mxo,.skrow,.tn,.jump button,.ctile,.bcard,.ro,.iconbtn,.seg button,.tgl,.fab,.bh-por,.chero-por{transition:transform .1s ease-out}
.btn:active,.chip:active,.mx:active,.sp:active,.spopt:active,.mxo:active,.tn:active,.jump button:active,.ctile:active,.iconbtn:active,.seg button:active,.tgl:active,.fab:active{transform:scale(.95)}
.bcard:active,.skrow:active{transform:scale(.985)}
.ro:active{transform:scale(.9)}
.fab{transition:transform .1s ease-out,background-color .2s,color .2s}
@media(prefers-reduced-motion:reduce){.bump,.tb.pin-in,.pit .chk{animation:none}.btn:active,.chip:active,.mx:active,.sp:active,.spopt:active,.mxo:active,.tn:active,.jump button:active,.ctile:active,.iconbtn:active,.seg button:active,.tgl:active,.fab:active,.bcard:active,.skrow:active,.ro:active{transform:none}}
.sheet{position:relative;width:100%;max-width:640px;max-height:min(84dvh,calc(100% - 24px));display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.anim{animation:up .26s cubic-bezier(.32,.72,0,1)}
@media(min-width:720px){.sheet-root{align-items:center}.sheet{border-radius:18px;max-height:min(80vh,780px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes upc{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media(min-width:720px){.sheet.anim{animation:upc .18s ease-out}}
@media(prefers-reduced-motion:reduce){.sheet.anim{animation:none}.ib:active,.bh-por:active{transform:none}}
.sheet-h{display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;font-size:16px;min-width:0;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-t{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-b>*{flex-shrink:0}
.sheet-b{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;min-height:0}
.sheet-f{border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.sheet-f>.btn.block{flex:1}
/* 아이템 추가: 위쪽에 현재 담긴 아이템 (누르면 빠짐, 끌어서 순서 변경) */
.tray{display:grid;grid-template-columns:repeat(var(--n),minmax(0,40px));gap:6px;height:40px;align-items:center}
.tb{width:100%;aspect-ratio:1;line-height:0;border-radius:7px;min-width:0}
.tb .ico{width:100%!important;height:100%!important;border-radius:7px;border:1px solid var(--line);background-size:var(--bs) auto!important}
.tb:active .ico{border-color:var(--danger)}
.tray-empty{display:flex;align-items:center;height:40px;padding:0 12px;border:1px dashed var(--line-strong);border-radius:10px;font-size:12.5px;color:var(--muted)}
.fgroup{display:flex;gap:8px;align-items:flex-start}
.fgroup .fl{flex:none;width:30px;font-size:11.5px;font-weight:600;color:var(--muted);padding-top:5px}
.fgroup .chips{flex:1;min-width:0;margin-right:-16px;padding-right:16px}
.fbar:empty{display:none}
.fbar{display:flex;align-items:center;justify-content:space-between;min-height:22px;font-size:12.5px;color:var(--muted)}
/* 긴 격자: 한 격자 안에서 칸마다 화면 밖이면 배치·그리기를 건너뜀 (묶음으로 나누면 중간 줄이 비는 문제) */
.lazy>*{content-visibility:auto;contain-intrinsic-size:auto 72px auto 92px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px 4px}
.pit{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;border-radius:8px}
.pit .ico{border-radius:8px;border:1px solid var(--line)}
.pit.legend .ico{border-color:color-mix(in srgb,var(--gold) 70%,transparent)}
.pit .nm{font-size:11.5px;line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:72px}
.pit .g{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.pit .chk{position:absolute;top:0;right:6px;width:18px;height:18px;border-radius:5px;background:var(--gold);color:var(--on-gold);font-size:11px;font-weight:700;display:grid;place-items:center}
.pit.in .ico{box-shadow:0 0 0 2px var(--gold)}
.pit:active{transform:scale(.95)}
.pprev{flex:1;min-width:0;display:flex;gap:10px;align-items:center}
.pprev .info{flex:1;min-width:0}
.pprev .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 정보 창 공통 머리 (아이템·룬·주문·파편·챔피언 같은 자리) */
.idet{display:flex;gap:14px;align-items:center}
.idet .ico{border-radius:10px;border:1px solid var(--line)}
.idet h3{font-size:19px;font-weight:500;line-height:1.3;color:var(--gold)}
.idet .k{font:700 12px var(--f-disp);color:var(--gold);letter-spacing:.06em}
.stat-col{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.6;font-variant-numeric:tabular-nums}
.price{font-size:14px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.desc{font-size:14px;line-height:1.65;color:var(--fg-2)}
.foot-note{font-size:12px;color:var(--muted);line-height:1.5}
.mini-h{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.irow{display:flex;flex-wrap:wrap;gap:8px 6px}
/* 하위 아이템 조직도 (접고 펴기, 모든 아이템 공통 상태) */
.comp{display:flex;flex-direction:column;gap:12px}
.tgl{display:flex;align-items:center;gap:6px;width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:500}
.tgl .chev{margin-left:auto;font-size:13px;transition:transform .15s}
.tgl[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tree{overflow-x:auto;padding-bottom:2px}
.tree ul{display:flex;justify-content:center;margin:0;padding:16px 0 0;position:relative}
.tree>ul{padding-top:0;min-width:max-content;margin:0 auto}
.tree li{list-style:none;display:flex;flex-direction:column;align-items:center;position:relative;padding:16px 3px 0}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:16px;border-top:1.5px solid var(--line-strong)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line-strong)}
.tree li:only-child::before,.tree li:only-child::after,.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--line-strong);border-radius:0 8px 0 0}
.tree li:first-child::after{border-radius:8px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--line-strong)}
.tn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;border-radius:8px}
.tn .ico{border-radius:7px;border:1px solid var(--line)}
.tn span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1}
.tn.root .ico{border-color:var(--gold)}
button.tn:active{background:var(--surface-2)}
/* 챔피언 정보: 능력치 + 스킬 전체 스크롤 */
.jump{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:5px}
.jump button{height:40px;display:flex;align-items:center;justify-content:center;padding:0 3px;border-radius:9px;border:1px solid var(--line);color:var(--muted);min-width:0;transition:background-color .12s,color .12s,border-color .12s}
.jump .kbox{min-width:14px;height:14px;padding:0 2px;font-size:10px}
.jump button.txt{padding:0 10px;font:600 13px var(--f-body)}
.jump button.mxk{border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold)}
.jump button[aria-current="true"]{background:var(--surface-2);color:var(--fg);border-color:var(--line-strong)}
.jump button.mxk[aria-current="true"]{color:var(--gold);border-color:var(--gold)}
.csec{display:flex;flex-direction:column;gap:10px}
.csec+.csec{padding-top:12px}
.sec-h{font-size:13px;font-weight:500;color:var(--muted)}
.amods{display:flex;flex-wrap:wrap;gap:6px}
.amod{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.amod b{font-weight:500;font-variant-numeric:tabular-nums}
.amod.up b{color:var(--ok)}
.amod.down b{color:var(--danger)}
.aab{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.aab li{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.5;color:var(--fg-2)}
.aab .kbox{min-width:13px;height:13px;padding:0 2px;font-size:9.5px}
.aab-sp{flex:none;width:28px}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cstats>div{background:var(--surface);padding:7px 12px;display:flex;flex-direction:column;min-width:0}
.cstats span{font-size:12px;color:var(--muted)}
.cstats b small{margin-left:5px;font-size:11.5px;font-weight:500;color:var(--ok)}
.calc{color:var(--gold)}
.calc-row{display:flex;align-items:center;gap:10px;margin-top:10px;height:32px}
.calc-row .lv{flex:none;width:58px;font-size:13px;color:var(--muted);white-space:nowrap}
.calc-row .lv b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.calc-row input{flex:1;min-width:0;accent-color:var(--gold);height:28px}
.cstats b{font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
.skd{display:flex;flex-direction:column;gap:10px;padding-top:26px}
.skd h3{font-size:15px;font-weight:500;line-height:1.35}
.skd-r{display:flex;gap:14px;align-items:flex-start}
.skd-r .desc{flex:1;min-width:0}
.sico{position:relative;flex:none;line-height:0}
.sico .ico{border-radius:3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 70%,transparent)}
.kbox{position:absolute;right:0;bottom:0;min-width:20px;height:20px;padding:0 4px;display:grid;place-items:center;font:500 12px/1 var(--f-body);color:#fff;background:rgba(8,12,16,.74);border-radius:4px 0 3px 0}
.skm{flex:1;min-width:0;font-size:14px;line-height:1.6;color:var(--muted);font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column;gap:8px}
html.rm .pop,html.rm .bump,html.rm .tb.pin-in,html.rm .pit .chk,html.rm .sheet.anim{animation:none}
html.rm .btn:active,html.rm .chip:active,html.rm .mx:active,html.rm .sp:active,html.rm .spopt:active,html.rm .mxo:active,html.rm .tn:active,html.rm .jump button:active,html.rm .ctile:active,html.rm .iconbtn:active,html.rm .seg button:active,html.rm .tgl:active,html.rm .fab:active,html.rm .bcard:active,html.rm .skrow:active,html.rm .ro:active,html.rm .ib:active,html.rm .bh-por:active{transform:none}
/* 설정: 항목 이름(왼쪽)과 선택지(오른쪽)를 한 줄로. 좁으면 선택지가 아래로 내려감 */
.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:52px;padding:8px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .lab{flex:1 1 80px;min-width:0}
.set-row .lab b{display:block;font-size:14.5px;font-weight:600}
.set-row .lab span{display:block;font-size:12.5px;line-height:1.4;color:var(--muted)}
.set-row .seg{flex:none}
.set-note{font-size:12.5px;color:var(--muted);margin-top:6px}
/* 빌드 맵 표시(머리), 이 맵 상점에 없는 아이템 표시 */
.mx.mp{color:var(--fg-2)}
.ib.off .ico,.tb.off .ico,.pit.off .ico{opacity:.38;filter:grayscale(1)}
.ib.off::after,.tb.off::after{content:'';position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.tb{position:relative}
.pick-map{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick-map .lbl{font-size:12.5px;color:var(--muted)}
.set-row .btn.sm{flex:none}
/* 여러 개 고르기: 카드 왼쪽 위 동그라미, 고른 카드는 금색 테두리 */
.bcard{position:relative;-webkit-touch-callout:none}
.bc-chk{position:absolute;left:6px;top:6px;z-index:1;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;pointer-events:none}
.bc-chk svg{width:15px;height:15px;stroke:var(--on-gold);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bcard.sel{border-color:var(--gold);background:var(--gold-soft)}
.bcard.sel .bc-chk{background:var(--gold);border-color:var(--gold)}
.iconbtn[aria-pressed="true"]{color:var(--gold)}
.iconbtn.danger{color:var(--danger)}
/* 홈: 탭 3개를 가로로 이어 붙여 밀어서 전환, 탭마다 따로 스크롤, 검색창은 각 탭 위에 고정 */
.home-pg>.pg-b{overflow:hidden;padding:0}
.home-pg .wrap.app{max-width:none;padding:0;height:100%}
.hm{display:flex;flex-direction:column;height:100%;--td:.28s}

function ghCfg(){

  return {token:c.token, owner:c.owner || ghOwner(), repo:c.repo || SYNC_REPO, api:c.api || 'https://api.github.com'};
}
const b64e = s => { const u = new TextEncoder().encode(s); let bin = ''; for(let i=0; i<u.length; i+=0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(bin); };
const b64d = s => { const bin = atob(String(s).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for(let i=0; i<bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); };
function ghFetch(cfg, path, opt={}){
  const headers = Object.assign({'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json'}, opt.headers||{});
  return fetch(`${cfg.api}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${path}`, Object.assign({cache:'no-store'}, opt, {headers}));
}
function ghStore(cfg){
  const FILE = '/contents/builds.json', DAY = 86400000;
  const m = lsGet(LS_GHM) || {};
  const st = {builds:m.builds||{}, del:m.del||{}, prefs:m.prefs||null, prefsT:m.prefsT||0, sha:m.sha||null, etag:m.etag||null, last:m.last||0};
  let pending = !!m.pending, edits = 0, pushing = false, again = false, pushT = 0, retryT = 0, fail = '', pulled = false, authToast = false;
  const subs = [], psubs = [];
  const save = () => lsSet(LS_GHM, {builds:st.builds, del:st.del, prefs:st.prefs, prefsT:st.prefsT, sha:st.sha, etag:st.etag, last:st.last, pending});
  const status = () => fail==='auth' ? 'error' : fail==='net' ? 'offline' : (pending || pushing) ? 'saving' : pulled ? 'synced' : 'loading';
  const report = () => { if(S.db!==api) return; if(!S.dirty.size || status()!=='synced') S.sync = status(); renderTop(); };
  const emit = fromCache => {
    const docs = Object.entries(st.builds).map(([id, b]) => ({id, exists:true, data:() => b}));
    subs.forEach(cb => { try{ cb({docs, metadata:{fromCache}}); }catch(e){ console.error(e); } });
    report();
  };
  const emitPrefs = () => { if(st.prefs) psubs.forEach(cb => { try{ cb({exists:true, data:() => st.prefs}); }catch{} }); };
  function authFail(code){
    fail = 'auth'; report();
    if(!authToast){ authToast = true; toast(code===404 ? '동기화 저장소에 접근할 수 없습니다. 설정 화면에서 토큰을 확인해 주세요' : '동기화 토큰이 맞지 않거나 만료되었습니다. 설정 화면에서 다시 연결해 주세요'); }
  }
  function netFail(){ fail = 'net'; report(); clearTimeout(retryT); retryT = setTimeout(() => { pull(false).then(() => { if(pending) schedule(0); }); }, 20000); }
  /* 받은 내용과 이 기기 내용 합치기 */
  function merge(r){
    let changed = false, prefsChanged = false, need = false;
    const rb = r.builds||{}, rd = r.del||{};
    for(const [id, t] of Object.entries(rd)) if(!(st.del[id] >= t)) st.del[id] = t;
    for(const [id, t] of Object.entries(st.del)){
      if(!(rd[id] >= t)) need = true;
      if(st.builds[id] && (st.builds[id].updated||0) <= t){ delete st.builds[id]; changed = true; }
    }
    for(const [id, b] of Object.entries(rb)){
      if(st.del[id] >= (b.updated||0)) continue;
      const l = st.builds[id];
      if(!l || (b.updated||0) > (l.updated||0)){ st.builds[id] = b; changed = true; }
      else if((l.updated||0) > (b.updated||0)) need = true;
    }
    for(const id of Object.keys(st.builds)) if(!rb[id]) need = true;
    if((r.prefsT||0) > st.prefsT){ st.prefs = r.prefs; st.prefsT = r.prefsT; prefsChanged = true; }
    else if(st.prefsT > (r.prefsT||0)) need = true;
    return {changed, prefsChanged, need};
  }
  async function pull(force){
    let res;
    try{ res = await ghFetch(cfg, FILE, {headers: !force && st.etag ? {'If-None-Match': st.etag} : {}}); }catch{ netFail(); return; }
    if(res.status===304){ fail = ''; pulled = true; st.last = Date.now(); save(); report(); return; }
    if(res.status===401 || res.status===403){ authFail(res.status); return; }
    if(res.status===404){   /* 파일이 아직 없음(첫 사용) → 이 기기 내용으로 만듦. 저장소 자체가 없으면 올릴 때 다시 404 */
      fail = ''; pulled = true; st.sha = null; st.etag = null; pending = true; save(); report(); schedule(0); return;
    }
    if(!res.ok){ netFail(); return; }
    let j; try{ j = await res.json(); }catch{ netFail(); return; }
    st.sha = j.sha || null; st.etag = res.headers.get('ETag');
    let remote = {}; try{ remote = JSON.parse(b64d(j.content||'')); }catch{}
    const r = merge(remote); fail = ''; pulled = true; st.last = Date.now();
    if(r.need){ pending = true; schedule(300); }
    save();
    if(r.changed) emit(false); else report();
    if(r.prefsChanged) emitPrefs();
  }
  function schedule(ms=1500){ clearTimeout(pushT); pushT = setTimeout(push, ms); }
  async function push(keep){
    if(pushing){ again = true; return; }
    if(!pending) return;
    pushing = true; report();
    try{
      for(let n=0; n<4; n++){
        for(const [id, t] of Object.entries(st.del)) if(Date.now() - t > 120*DAY) delete st.del[id];   /* 오래된 삭제 기록 정리 */
        const sent = edits;   /* 이 내용을 만든 시점의 변경 번호: 올리는 사이 새 변경이 생기면 끝난 뒤 한 번 더 올림 */
        const doc = {app:'템트리 노트', format:1, at:Date.now(), builds:st.builds, del:st.del, prefs:st.prefs, prefsT:st.prefsT};
        const body = JSON.stringify(Object.assign({message:'빌드 저장', content:b64e(JSON.stringify(doc))}, st.sha ? {sha:st.sha} : {}));
        let res;
        try{ res = await ghFetch(cfg, FILE, {method:'PUT', headers:{'Content-Type':'application/json'}, body, keepalive: !!keep && body.length < 60000}); }catch{ netFail(); return; }
        if(res.ok){ let j = {}; try{ j = await res.json(); }catch{} st.sha = j.content && j.content.sha || st.sha; st.etag = null; if(edits===sent) pending = false; else again = true; fail = ''; st.last = Date.now(); save(); return; }
        if(res.status===409 || res.status===422){ await pull(true); if(fail) return; continue; }   /* 다른 기기가 먼저 저장 → 받아 합친 뒤 다시 */
        if(res.status===401 || res.status===403 || res.status===404){ authFail(res.status); return; }
        netFail(); return;
      }
      netFail();
    } finally { pushing = false; report(); if(again){ again = false; schedule(400); } }
  }
  const api = {
    kind:'github', owner:cfg.owner, repo:cfg.repo, status, last:() => st.last,
    collection(){ return {onSnapshot(cb){ subs.push(cb); setTimeout(() => emit(true), 0); return () => {}; }}; },
    doc(path){
      const [col, id] = path.split('/');
      return {
        set(body){ if(col==='builds'){ st.builds[id] = clone(body); delete st.del[id]; } else { st.prefs = clone(body); st.prefsT = Date.now(); } pending = true; edits++; save(); schedule(); report(); return Promise.resolve(); },
        delete(){ if(col==='builds'){ delete st.builds[id]; st.del[id] = Date.now(); } pending = true; edits++; save(); schedule(); report(); return Promise.resolve(); },
        onSnapshot(cb){ psubs.push(cb); setTimeout(emitPrefs, 0); return () => {}; },
      };
    },
    sync(){ return pull(true).then(() => { if(pending && !fail) return push(); }); },
  };
  /* 여는 순간·앱으로 돌아올 때·45초마다(바뀐 게 없으면 요청 횟수에 포함되지 않는 확인 방식) 받아오고, 앱을 떠날 때 바로 올림 */
  setTimeout(() => pull(false), 0);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') pull(false); else if(pending){ clearTimeout(pushT); push(true); } });
  window.addEventListener('online', () => { pull(false).then(() => { if(pending) schedule(0); }); });
  setInterval(() => { if(document.visibilityState==='visible' && !pushing) pull(false); }, 45000);
  return api;
}
/* 앱 설치 (크롬·엣지가 설치를 제안할 때 받아 두었다가 정보 화면 버튼으로 실행) */
let INSTALL = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; const t = topSheet(); if(t && t.kind==='about') renderSheet(); });
window.addEventListener('appinstalled', () => { INSTALL = null; toast('앱을 설치했습니다'); const t = topSheet(); if(t && t.kind==='about') renderSheet(); });

/* ------------------------------------------------------------ 저장소 */
async function initStore(){
  const cached = lsGet(LS_CACHE);
  if(cached && Array.isArray(cached.builds)){ cached.builds.forEach(b=>S.builds.set(b.id, normalize(b))); if(cached.prefs) S.prefs=normPrefs(cached.prefs); }
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if(!db && !inClaude()){ const c = ghCfg(); if(c && c.owner) db = ghStore(c); }   /* 설치형 앱: 토큰이 있으면 GitHub 동기화 */
  if(!db){
    S.sync = 'local'; S.builds = new Map();
    const loc = lsGet(LS_BUILDS) || {builds:[],prefs:{fav:[]}};
    (loc.builds||[]).forEach(b=>S.builds.set(b.id, normalize(b))); S.prefs = normPrefs(loc.prefs||{});
    S.loaded = true; refresh(); return;
  }
  S.db = db;
  db.collection('builds').onSnapshot(snap => {
    const next = new Map();
    snap.docs.forEach(d => { if(d.exists) next.set(d.id, normalize(Object.assign(clone(d.data()), {id:d.id}))); });
    for(const id of S.dirty){ if(S.builds.has(id)) next.set(id, S.builds.get(id)); }
    const cb = curBuild(); if(cb && S.edit && next.has(cb.id)) next.set(cb.id, cb);  /* 편집 중인 빌드는 화면 상태 유지 */
    S.builds = next;
    const first = !S.loaded; S.loaded = true;
    if(!S.dirty.size) S.sync = snap.metadata && snap.metadata.fromCache ? 'loading' : 'synced';
    if(first) checkLocalImport();
    cacheLocal(); refresh();
  }, () => { S.sync = 'error'; renderTop(); toast('저장소 연결이 끊겼습니다. 새로 고침해 주세요'); });
  db.doc('meta/prefs').onSnapshot(d => {
    if(d.exists){ S.prefs = normPrefs(d.data()); cacheLocal(); refresh(); }
  }, () => {});
}
function checkLocalImport(){
  const loc = lsGet(LS_BUILDS);
  S.localPending = loc && Array.isArray(loc.builds) ? loc.builds.filter(b => b && b.id && b.champ && !S.builds.has(b.id)) : [];
}
/* 기기 저장 + 내용이 실제로 바뀌었을 때만 번호를 올려, 아래에 쌓인 화면이 낡았는지 판단 (한가할 때 갱신) */
let lastCache = '';
function cacheLocal(){
  const json = JSON.stringify({builds:[...S.builds.values()], prefs:S.prefs});
  if(json !== lastCache){ lastCache = json; S.rev++; idleFresh(); }
  try{ localStorage.setItem(S.db ? LS_CACHE : LS_BUILDS, json); }catch{}
}
/* 변경 기록: 화면은 즉시, 저장은 0.65초 모아서 한 번 */
function touch(b, {render=true, keepPatch=false}={}){
  if(S.readonly) return;
  b.updated = Date.now(); if(!keepPatch) b.patch = D.patch;
  S.dirty.add(b.id); S.sync = 'saving'; renderTop();
  clearTimeout(timers[b.id]); timers[b.id] = setTimeout(()=>flush(b.id), 650);
  cacheLocal();
  if(render){ if(mainCovered()) markMain(); else renderMain(); }
}
function flush(id){
  clearTimeout(timers[id]); delete timers[id];
  const b = S.builds.get(id); if(!b) return Promise.resolve();
  const body = toDoc(b);
  const p = (chains[id] || Promise.resolve()).then(() => S.db ? S.db.doc('builds/'+id).set(body) : (cacheLocal(), null))
    .then(() => { if(!timers[id]) S.dirty.delete(id); if(!S.dirty.size) S.sync = S.db ? (S.db.status ? S.db.status() : 'synced') : 'local'; renderTop(); })
    .catch(e => handleWriteError(e));
  chains[id] = p; return p;
}
function flushAll(){ Object.keys(timers).forEach(flush); }
function handleWriteError(e){
  const code = e && e.code;
  if(code === 'invalid_argument' || code === 'not_granted'){ S.readonly = true; S.edit = false; toast('이 계정에는 저장 권한이 없습니다'); }
  else if(code === 'quota_exceeded'){ toast('저장 공간이 가득 찼습니다. 오래된 빌드를 지워 주세요'); }
  else if(code === 'unavailable'){ toast('연결이 불안정합니다. 잠시 후 다시 저장합니다'); }
  else toast('저장하지 못했습니다. 연결을 확인해 주세요');
  S.sync = 'error'; refresh();
}
async function removeBuild(id){
  clearTimeout(timers[id]); delete timers[id]; S.dirty.delete(id);
  S.builds.delete(id); cacheLocal();
  if(S.db){ try{ await (chains[id]||Promise.resolve()); await S.db.doc('builds/'+id).delete(); }catch(e){ handleWriteError(e); } }
}
let prefT;
function savePrefs(){
  cacheLocal(); clearTimeout(prefT);
  prefT = setTimeout(() => { if(S.db) S.db.doc('meta/prefs').set({fav:S.prefs.fav, cdm:S.prefs.cdm==='sr'?'sr':'aram', nbm:S.prefs.nbm==='sr'?'sr':'aram', sets:S.prefs.sets||[]}).catch(handleWriteError); }, 400);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') flushAll(); });
window.addEventListener('online', () => { S.offline=false; renderTop(); });
window.addEventListener('offline', () => { S.offline=true; renderTop(); });

/* ------------------------------------------------------------ 탐색: 기기 뒤로·앞으로, 마우스 옆 버튼, 밀기 제스처를 앱 안에서 한 단계씩 처리
   기록 한 칸 = 페이지 하나. 앱 안에서 뒤로 갈 때는 화면을 먼저 바꾸고(기다림 없음) 브라우저 기록은 뒤에서 맞춤 */
const SID = Math.random().toString(36).slice(2, 8);
let histOK = true;
const NAV = {fwd: [], hi: 0, exp: [], swipe: null};   /* hi: 브라우저 기록이 있을(곧 갈) 단계, exp: 앱이 직접 움직여 곧 도착할 기록 */
const depth = () => S.views.length - 1 + S.sheets.length;
const histSynced = () => histOK && NAV.hi === depth();
/* 홈에서 기기 뒤로 가기: 첫 번째는 '한 번 더 누르면 종료' 알림, 2초 안에 한 번 더 누르면 종료
   홈 맨 앞 기록 위에 보호 칸(guard)을 하나 두고, 사용자가 누른 직후에만 추가 (누르지 않고 추가한 기록은 크롬이 건너뜀) */
const GUARD_ON = () => histOK && !inClaude() && (STANDALONE || matchMedia('(pointer: coarse)').matches);
function ensureGuard(){
  if(!GUARD_ON() || depth()!==0 || S.sel) return;
  const st = history.state; if(st && (st.guard || st.sel || st.i>0)) return;
  try{ history.pushState({ttn:SID, i:0, guard:1}, ''); }catch{}
}
['click','keydown'].forEach(t => document.addEventListener(t, ensureGuard, true));
document.addEventListener('pointerup', e => { if(e.pointerType!=='mouse') ensureGuard(); }, true);
function pushHist(){
  NAV.fwd = [];
  if(GUARD_ON() && depth()===1){ const cs = history.state; if(cs && cs.i===0 && !cs.guard && !cs.sel){ try{ history.pushState({ttn:SID, i:0, guard:1}, ''); }catch{} } }
  if(histOK){ try{ history.pushState({ttn:SID, i:depth()}, ''); NAV.hi = depth(); }catch{ histOK = false; } }
  syncCW();
}
function histGo(d){ if(!histOK || !d) return; NAV.hi += d; NAV.exp.push({i:NAV.hi, t:Date.now()}); try{ history.go(d); }catch{} }
const rewind = k => histGo(-k);
function stepBack(){
  if(S.sheets.length){ NAV.fwd.push({t:'s', s:S.sheets.pop()}); return 'sheet'; }
  if(S.views.length>1){ flushAll(); NAV.fwd.push({t:'v', v:S.views.pop()}); S.edit = false; resetEditState(); return 'view'; }
  return '';
}
function stepForward(){
  const e = NAV.fwd.pop(); if(!e) return '';
  if(e.t==='s'){ S.sheets.push(e.s); return 'sheet'; }
  flushAll(); S.views.push(e.v); S.edit = false; resetEditState(); return 'view';
}
function applyNav(dir){ syncPages(dir); syncCW(); }
window.addEventListener('popstate', e => {
  const st = e.state, target = st && st.ttn===SID ? st.i : 0, now = Date.now();
  NAV.exp = NAV.exp.filter(x => now - x.t < 2500);
  if(NAV.exp.length && NAV.exp[0].i===target){ NAV.exp.shift(); return; }   /* 앱이 이미 화면을 맞춰 둔 이동 */
  if(S.sel && !(st && st.sel)){ S.selHist = false; selExit(true); if(target===depth()) return; }   /* 여러 개 고르기 중 뒤로 = 고르기 끝 */
  if(GUARD_ON() && target===0 && depth()===0 && !(st && (st.guard || st.sel))){ S.exitAt = Date.now(); toast('한 번 더 누르면 종료됩니다'); return; }   /* 홈 맨 앞: 다음 뒤로 가기는 앱 종료 */
  NAV.exp = []; NAV.hi = target;
  if(S.panel && target < depth()){   /* 팝업이 열려 있으면 화면은 그대로 두고 팝업만 닫은 뒤 기록을 다시 채움 */
    closePanel(); NAV.fwd = [];
    if(histOK){ try{ history.pushState({ttn:SID, i:depth()}, ''); NAV.hi = depth(); }catch{} }
    return;
  }
  let dir = '', n = 0, guard = 60;
  while(depth() > target && guard--){ if(stepBack()) n++; dir = 'back'; }
  while(depth() < target && NAV.fwd.length && guard--){ if(stepForward()) n++; dir = 'fwd'; }
  if(depth()!==target) histGo(depth() - target);   /* 기록과 화면이 어긋나면 기록 쪽을 맞춤 */
  if(n) applyNav(dir); else syncCW();
});
function closePanel(){ if(!S.panel) return false; S.panel = null; renderMain(); syncCW(); return true; }
function navBack(){ if(S.sel){ selExit(); return; } if(closePanel() || !depth()) return; const synced = histSynced(); if(stepBack()){ applyNav('back'); if(synced) rewind(1); } NAV.swipe = null; }
function navForward(){ if(!NAV.fwd.length) return; const synced = histSynced(); if(stepForward()){ applyNav('fwd'); if(synced) histGo(1); } }
function resetEditState(){ S.panel=null; S.lastRune=''; }
function go(view){ flushAll(); S.views.push(view); S.edit = !!view.edit; resetEditState(); pushHist(); syncPages('fwd'); }
function openSheet(kind, props={}){ S.sheets.push({kind, props}); pushHist(); syncPages('fwd'); }
function replaceSheet(kind, props={}){ if(!S.sheets.length) return openSheet(kind, props); S.sheets[S.sheets.length-1] = {kind, props}; syncPages('fwd'); }
function closeSheet(){ navBack(); }
function closeAllSheets(){
  const k = S.sheets.length; if(!k) return;
  const synced = histSynced();
  while(S.sheets.length) NAV.fwd.push({t:'s', s:S.sheets.pop()});
  applyNav('back'); if(synced) rewind(k);
}
/* 안드로이드 크롬: 기기 뒤로 가기를 페이지가 받을 수 있으면 앱 안에서 한 단계 뒤로 (받지 못하는 환경에서는 영향 없음) */
let CW = null;
function syncCW(){
  if(!('CloseWatcher' in window) || !/Android/i.test(navigator.userAgent)) return;
  try{
    if(depth()>0 && !CW){ CW = new CloseWatcher(); CW.onclose = () => { CW = null; navBack(); }; }
    else if(depth()===0 && CW){ const c = CW; CW = null; c.destroy(); }
  }catch{ CW = null; }
}
const KB = {on:false};
document.addEventListener('keydown', e => { if(e.key==='Tab' || e.key==='Enter' || e.key===' ') KB.on = true; }, true);
document.addEventListener('pointerdown', () => { KB.on = false; }, true);
/* 마우스 옆 버튼(뒤로·앞으로) */
document.addEventListener('mousedown', e => { if(e.button===3 || e.button===4) e.preventDefault(); });
document.addEventListener('mouseup', e => { if(e.button===3){ e.preventDefault(); navBack(); } else if(e.button===4){ e.preventDefault(); navForward(); } });

/* ------------------------------------------------------------ 렌더링 */
function refresh(){
  if(!D) return;
  idleFresh();
  if(DRAG.st && DRAG.st.on){ S.mainDirty = true; return; }   /* 끌어서 옮기는 중에는 다시 그리지 않음 */
  if(mainCovered()){ markMain(); renderTop(); return; }      /* 위 페이지가 덮고 있으면 한가할 때 그림 */
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')){ renderTop(); return; }
  render();
}
function render(){ renderTop(); renderMain(); }
function renderMain(){ const pg = viewPage(); if(pg) renderView(pg); }
function dirtyMain(){ PG.forEach(pg => { if(pg.__sec && pg.__src.name!=='home') pg.__sec.key = ''; }); }

/* ------------------------------------------------------------ 페이지 쌓기
   보기(홈·챔피언·빌드)와 정보 페이지(챔피언 정보·아이템·룬·주문·아이템 추가 등)를 한 줄로 쌓음.
   새 페이지는 오른쪽에서 들어오고, 바로 아래 페이지는 그대로 남아 있다가 밀어서 뒤로 갈 때 곧바로 드러남 (다시 그리지 않음) */
const PG = [];
const MENU = {buildMenu:1};   /* 페이지가 아닌 아래 작은 메뉴 */
const isMenu = s => !!(s && MENU[s.kind]);
const PAR = 0.28, T_PUSH = 300, T_POP = 250, EASE = 'cubic-bezier(.32,.72,0,1)';
const topPage = () => PG[PG.length-1];
const topBody = () => { const p = topPage(); return p ? p.body : null; };
const viewPage = () => PG[S.views.length-1];
const pickerPage = () => PG.find(p => p.__src.kind==='picker');
const dimOf = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dim')) || .16;
const tx = x => `translate3d(${Math.round(x*10)/10}px,0,0)`;
function makePage(src){
  const pg = document.createElement('section'); pg.className = 'page'; pg.__src = src; pg.isView = !src.kind;
  if(pg.isView){
    const bld = src.name==='build';
    pg.innerHTML = `<header class="top"><div class="wrap tbar"></div></header><div class="pg-b vb"><div class="wrap app${bld?' narrow':''}"></div></div>${bld?'<button class="fab" id="fab" data-act="toggle-edit"></button>':''}<div class="pg-dim"></div>`;
    if(bld) pg.classList.add('has-fab');
  } else {
    pg.setAttribute('role', 'dialog');
    pg.innerHTML = `<header class="top"><div class="wrap narrow tbar"></div></header><div class="pg-t" hidden></div><div class="pg-b sb"></div><div class="pg-f" hidden></div><div class="pg-dim"></div>`;
  }
  pg.tbar = pg.querySelector('.tbar'); pg.body = pg.querySelector('.pg-b'); pg.app = pg.querySelector('.app'); pg.fab = pg.querySelector('.fab');
  pg.ptop = pg.querySelector('.pg-t'); pg.foot = pg.querySelector('.pg-f'); pg.dim = pg.querySelector('.pg-dim');
  return pg;
}
/* 화면 이동 움직임: 진행 중에 다른 이동이 오면 즉시 끝 상태로 맞추고 새 이동 시작 (겹쳐서 꼬이지 않음) */
let RUN = [];
function runAnim(list, done){
  const job = {over:false};
  job.anims = list.filter(x => x[0]).map(([el, kf, o]) => el.animate(kf, Object.assign({easing:EASE}, o, {duration:Math.round((o.duration||0) * MOF())})));
  job.fin = () => { if(job.over) return; job.over = true; RUN = RUN.filter(j => j!==job); job.anims.forEach(a => a.cancel()); if(done) done(); };
  RUN.push(job);
  Promise.all(job.anims.map(a => a.finished)).then(job.fin, () => {});
  return job;
}
function finishAnims(){ RUN.slice().forEach(j => j.fin()); }
function syncPages(dir){
  const want = [...S.views, ...S.sheets.filter(s => !isMenu(s))], stack = $('#stack');
  finishAnims();
  if(SW.st){ if(SW.st.press) SW.st.press.classList.remove('nopress'); SW.st = null; }   /* 밀던 중 기기 뒤로 등으로 바뀌면 밀기 중단 */
  const boot = stack.querySelector('.boot'); if(boot) boot.remove();
  const oldTop = topPage();
  let i = 0; while(i < PG.length && i < want.length && PG[i].__src===want[i]) i++;
  const gone = PG.splice(i), added = [];
  for(let j=i; j<want.length; j++){ const pg = makePage(want[j]); stack.appendChild(pg); PG.push(pg); added.push(pg); }
  added.forEach(pg => pg.isView ? renderView(pg) : fillSheetPage(pg));
  const top = topPage();
  if(stale(top) && !added.includes(top)) renderView(top);   /* 다시 드러난 보기가 낡았으면 움직이기 전에 갱신 */
  PG.forEach((pg, k) => { const d = PG.length-1-k; pg.classList.toggle('under', d===1); pg.classList.toggle('deep', d>1); pg.inert = d>0; pg.style.transform = ''; pg.dim.style.opacity = ''; });
  gone.forEach(g => { g.classList.add('leaving'); g.classList.remove('under','deep'); g.inert = true; g.querySelectorAll('[id]').forEach(el => el.removeAttribute('id')); });   /* 나가는 페이지의 id는 떼서 새 페이지와 겹치지 않게 */
  document.body.classList.toggle('fab-on', !!(top && top.isView && top.__src.name==='build'));
  const sw = NAV.swipe; NAV.swipe = null;
  const W = stack.clientWidth || innerWidth;
  if(!dir || REDUCE() || !top || (!added.length && !gone.length)){ gone.forEach(g => g.remove()); }
  else if(added.length){
    /* 쌓기: 새 페이지가 오른쪽에서 들어오고, 덮이는 페이지는 왼쪽으로 조금 밀리며 어두워짐 */
    const prev = PG[PG.length-2], list = [[top, [{transform:tx(W)},{transform:tx(0)}], {duration:T_PUSH}]];
    if(prev && prev===oldTop) list.push([prev, [{transform:tx(0)},{transform:tx(-PAR*W)}], {duration:T_PUSH}], [prev.dim, [{opacity:0},{opacity:dimOf()}], {duration:T_PUSH}]);
    runAnim(list, () => gone.forEach(g => g.remove()));
    if(KB.on){ const bk = top.querySelector('.top [data-act=back]'); if(bk) bk.focus({preventScroll:true}); }
  } else {

function renderMenu(){
  const root = $('#sheet'), top = topSheet();
  document.body.classList.toggle('menu-on', isMenu(top));
  if(!isMenu(top)){
    if(!root.hidden && !root.classList.contains('closing')){
      const sh = root.querySelector('.sheet'), bd = root.querySelector('.backdrop');
      if(sh && !REDUCE()){
        /* 닫힘: 아래로 내려가며 사라짐 (끌어 내리던 위치에서 이어서) */
        root.classList.add('closing');

        sh.animate(desk ? [{opacity:1, transform:'none'},{opacity:0, transform:'scale(.97)'}] : [{transform:from},{transform:'translateY(100%)'}], {duration:desk?150:200, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards'});
        if(bd) bd.animate([{opacity:getComputedStyle(bd).opacity},{opacity:0}], {duration:200, fill:'forwards'});
        sheetCloseT = setTimeout(() => closeSheetRoot(root), 210);
      } else closeSheetRoot(root);
    }
    return;
  }
  if(root.classList.contains('closing')){ clearTimeout(sheetCloseT); root.classList.remove('closing'); root.hidden = true; root.innerHTML = ''; }

    if(!REDUCE()) root.querySelector('.backdrop').animate([{opacity:0},{opacity:1}], {duration:200});

  sh.querySelector('.sheet-b').innerHTML = r.body;
}

/* 아이템 목록: 협곡·칼바람 아이템을 함께 보여 주고, 이름이 같은 항목은 하나만 */
function pickerItems(b){ const P = S.picker; return filterItems(poolKey(b), P.tier, P.stats, P.q, b.it); }
/* 맵 상점 아이템 + 이미 담긴 아이템, 분류·능력치·이름 조건 */
function filterItems(pref, tier, stats, q, keep){
  const byName = new Map();
  for(const [id,it] of Object.entries(D.items)) if(it[pref] && !byName.has(it.n)) byName.set(it.n, id);
  for(const id of keep||[]){ const it = D.items[id]; if(it) byName.set(it.n, id); }
  let list = [...byName.values()].map(id=>[id, D.items[id]]);
  if(tier==='legend') list = list.filter(([,it])=>it.tier==='legend');
  else if(tier==='boots') list = list.filter(([,it])=>it.c.includes('boots'));
  else if(tier==='start') list = list.filter(([,it])=>it.c.includes('start'));
  if(stats.length) list = list.filter(([id])=>stats.every(k=>IX.istat[id].has(k)));
  if(q) list = list.filter(([,it])=>match(q, it.n));
  list.sort((a,b2)=> (q ? rankOf(q,a[1].n)-rankOf(q,b2[1].n) : 0) || (TIER_ORDER[a[1].tier]-TIER_ORDER[b2[1].tier]) || koCmp(a[1].n, b2[1].n));
  return list;
}

  return `<div class="tray" data-sort="tray" style="--n:${Math.max(8,b.it.length)}">${b.it.map(id=>{ const it=IX.item[id]; return `<button class="tb${id===bumpId?' pin-in':''}${it&&!inPool(b,id)?' off':''}" data-drag data-act="tray-del" data-id="${id}" aria-label="${esc(it?it.n:(b.nm[id]||'아이템'))} 빼기">${icoFluid('items', it?it.i:-1)}</button>`; }).join('')}</div>`;
}

    let j = await fresh;
    if(!j && okShape(cached)) j = cached;   /* 새로 받지 못하면 예전 저장본이라도 사용 */
    if(!j){ $('#stack').innerHTML = `<div class="boot"><div class="empty"><b>패치 데이터를 불러오지 못했습니다</b><span>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</span><button class="btn primary" data-act="reload">다시 시도</button></div></div>`; return; }
    if(j.__raw) keep(j); D = j; indexData();
  } else {
    fresh.then(j => {
      if(!j || (j.rev && j.rev===D.rev)) return;
      keep(j); D = j; indexData(); SK = null; skLoading = null; S.rev++; dirtyMain();
      PG.forEach(pg => pg.isView ? renderView(pg) : fillSheetPage(pg)); renderMenu();
    });
  }
  syncPages('');
  (window.requestIdleCallback || ((f)=>setTimeout(f, 800)))(() => ['champs','items','runes','spells'].forEach(warmSheet), {timeout:2000});
  await initStore();
  if(S.tab==='builds' && S.loaded && !S.builds.size && S.views.length===1) S.tab='champs';   /* 빌드가 하나도 없으면 챔피언부터 */
  render();
  setTimeout(loadSkills, 2500);
}
const hot = window.claude && window.claude.hot;
try{ if(hot && typeof hot.snapshot==='function') hot.snapshot(() => ({views:S.views, tab:S.tab})); }catch{}
if(hot && typeof hot.ready==='function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
